ld, Mitte die Rekonstruktion (91 %), rechts die freie Variante (60 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_bb_eg.webp", "w": 1454, "h": 778, "nr": 12, "cap": "Typ Bb (Hof hinten) · Erdgeschoss: links das Vorbild, Mitte die Rekonstruktion (100 %), rechts die freie Variante (72 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_bb_og.webp", "w": 1438, "h": 778, "nr": 13, "cap": "Typ Bb (Hof hinten) · Obergeschoss: links das Vorbild, Mitte die Rekonstruktion (95 %), rechts die freie Variante (87 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_dn_eg.webp", "w": 1454, "h": 776, "nr": 14, "cap": "Duartes neues Haus · Erdgeschoss: links das Vorbild, Mitte die Rekonstruktion (100 %), rechts die freie Variante (60 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_dn_og.webp", "w": 1388, "h": 778, "nr": 15, "cap": "Duartes neues Haus · Obergeschoss: links das Vorbild, Mitte die Rekonstruktion (kein gültiger Plan), rechts die freie Variante (kein gültiger Plan). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_t2_eg.webp", "w": 1454, "h": 778, "nr": 16, "cap": "Haus mit 2 Zimmern · Erdgeschoss: links das Vorbild, Mitte die Rekonstruktion (100 %), rechts die freie Variante (89 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_t2_og.webp", "w": 1454, "h": 778, "nr": 17, "cap": "Haus mit 2 Zimmern · Obergeschoss: links das Vorbild, Mitte die Rekonstruktion (100 %), rechts die freie Variante (93 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_t4_eg.webp", "w": 1454, "h": 778, "nr": 18, "cap": "Haus mit 4 Zimmern · Erdgeschoss: links das Vorbild, Mitte die Rekonstruktion (100 %), rechts die freie Variante (93 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_t4_og.webp", "w": 1438, "h": 778, "nr": 19, "cap": "Haus mit 4 Zimmern · Obergeschoss: links das Vorbild, Mitte die Rekonstruktion (88 %), rechts die freie Variante (72 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_t5_eg.webp", "w": 1454, "h": 778, "nr": 20, "cap": "Haus mit 5 Zimmern · Erdgeschoss: links das Vorbild, Mitte die Rekonstruktion (100 %), rechts die freie Variante (77 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}, {"t": "fig", "src": "img/kremlas_fig_sz_t5_og.webp", "w": 1438, "h": 778, "nr": 21, "cap": "Haus mit 5 Zimmern · Obergeschoss: links das Vorbild, Mitte die Rekonstruktion (62 %), rechts die freie Variante (39 %). Grün: Räume mit mindestens 90 % Überdeckung.", "quelle": "eigene Darstellung"}]}, {"slide": 3, "title": "Was die Obergeschosse schwer macht", "short": "Was die Obergeschosse schwer macht", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Die Erdgeschosse gelingen meist vollständig, die Obergeschosse deutlich seltener. Dort liegen viele kleine Räume an schmalen Gängen, und der Flur besteht aus drei bis vier verketteten Rechtecken, die sich um die feste Treppe und den Luftraum legen müssen. In den Fehlschlägen ist der Flur fast immer zu klein oder überlappt, und die Türen zum Abstellraum oder zum Bad fehlen. Für das Obergeschoss von Duartes neuem Haus fand die Suche in keiner Reihe einen gültigen Plan."}]}, {"slide": 4, "title": "Haus aus zwei Geschossen (seit 25.11.2026)", "short": "Haus aus zwei Geschossen (seit 25.11.2026)", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Einzeln erzeugte Geschosse passen nicht zusammen: Treppe und Hof können im Obergeschoss woanders liegen als im Erdgeschoss. Seit dem 25.11.2026 entstehen beide zusammen. Die Treppe ist ein eigener Raum mit festen Maßen aus dem Vorbild; die gerade Treppe der Typen Ab, zwei Zimmer und Duartes neues Haus steht im Wohnraum und wird dafür aus ihm ausgeschnitten. Das Obergeschoss übernimmt Treppe und Hof aus dem Erdgeschoss als feste Räume: die Treppe an derselben Stelle, den Luftraum genau über dem Hof, Teil für Teil. Beide wachsen im Plan nicht, andere Räume weichen ihnen aus."}, {"t": "p", "md": "Gezeichnet wird die Treppe mit Stufen und Lauflinie, Punkt am Antritt, Pfeil am Austritt; die zweiläufige Treppe mit Wendepodest. Geprüft wird, ob Antritt und Austritt zugänglich sind: Vor dem Antritt im Erdgeschoss und vor dem Austritt im Obergeschoss muss ein Podest so breit wie der Lauf und so tief, wie der Lauf breit ist, mindestens 0,8 m (nach DIN 18065), ganz in einem Raum liegen, der die Treppe erschließt, und der Zugang muss dort offen sein. Bei der zweiläufigen Treppe zählt im Erdgeschoss der Antrittslauf, im Obergeschoss der Austrittslauf. Alle sechs Vorbilder erfüllen diese Regeln."}, {"t": "p", "md": "Zuerst arbeitete die Suche in zwei Schritten: erst ein gültiges Erdgeschoss, dann bis zu drei Läufe für ein passendes Obergeschoss mit Treppe und Hof aus genau diesem Erdgeschoss. Seit dem Abend des 25.11.2026 ist das Haus ein Individuum: Jedes Individuum trägt Erd- und Obergeschoss; bei jedem Kind übernimmt das Obergeschoss Treppe und Hof aus dem Plan genau seines Erdgeschosses, dann wird auch das Obergeschoss verändert. Bewertet und ausgewählt wird die Summe der Planbewertungen beider Geschosse, so setzen sich Erdgeschosse durch, zu denen ein Obergeschoss passt. Die getrennten Läufe für das Obergeschoss bleiben als Rückfall. Eine eigene Mutation legt die Treppe an ihren Zugang (im Obergeschoss rückt der Flur vor die feste Treppe), auch beim Nachbessern. Das Obergeschoss läuft mit seinen eigenen abgestimmten Einstellungen."}, {"t": "table", "kopf": ["Haus", "Häuser in 2 × 24 Läufen: getrennt EG, dann OG", "Haus als ein Individuum", "Ähnlichkeit (Mittel EG und OG)"], "zeilen": [["Typ Bb (Hof hinten)", "5", "5", "13–66 %"], ["Haus mit fünf Zimmern", "1", "5", "39–53 %"], ["Typ Ab (Hof vorn)", "0", "3", "13–36 %"], ["Haus mit vier Zimmern", "0", "0", "–"], ["Duartes neues Haus", "0", "0", "–"], ["Haus mit zwei Zimmern", "0", "0", "–"], ["Summe", "6", "13", ""]]}, {"t": "p", "md": "Gültige Erdgeschosse findet die Suche für alle Häuser; es scheitert meist das Obergeschoss, weil es mit der Lage von Treppe und Hof leben muss, die das Erdgeschoss gewählt hat. Das Haus als ein Individuum verdoppelt die Zahl der Häuser. Dass den Obergeschossen am Ende meist Fläche fehlt, liegt nicht an einem zu großen Hof: Eine anteilige Flächenforderung (die Räume teilen sich, was Treppe und Luftraum übrig lassen) brachte weniger Häuser (8 statt 13) und wurde verworfen."}, {"t": "fig", "src": "img/kremlas_fig_balken.webp", "w": 1700, "h": 874, "nr": 22, "cap": "Ähnlichkeit zum Vorbild für alle 20 Vorbilder, Mittel über vier Suchreihen: dunkel die Rekonstruktion, hell die freie Variante.", "quelle": "eigene Darstellung"}]}], "bericht": true}, {"id": "k8", "title": "Fehler und Korrekturen", "goal": "Was am meisten gebracht hat: gefundene Fehler.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_fig_sz_ab_og.webp", "units": [{"slide": 1, "title": "Was am meisten gebracht hat", "short": "Was am meisten gebracht hat", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Die größten Sprünge kamen nicht aus neuen Verfahren, sondern aus gefundenen Fehlern. Deshalb hier die wichtigsten, mit ihrer Wirkung."}, {"t": "table", "kopf": ["Fehler", "Wirkung", "Korrektur"], "zeilen": [["Federzuschlag immer positiv (Original)", "rund die Hälfte der Federn zog falsch herum", "Zuschlag zeigt zum Nachbarn"], ["Federn tot bei Berührung (Original)", "gerade die fast fertigen Nachbarn bekamen keinen Zug", "kleinere Überdeckung gilt als Berührrichtung"], ["Sortierung mit Untergrenze 1 (Original, `FitOverl`) | alle fast gültigen Pläne galten als gleich gut | f3 ohne Untergrenze sortiert"], ["Türregel 0,9 + 0,2 m auch für Siza", "sieben von zwölf Siza-Vorbildern waren selbst ungültig", "Türbreite je Programm, Siza 0,80 m"], ["Loggia als „L-Form“ gelesen (Übersetzer Palladio)", "Villa Angarano ohne Eingang", "Loggien als offener Eingang"], ["Außentür als Raum gelesen (Übersetzer Siza)", "Häuser ohne Eingang von der Straße", "Außentüren erkannt"], ["Feldrahmen in Sg fest 500 × 430 px", "bei Siza wurde der hintere Streifen als „außerhalb“ bestraft", "Rahmen folgt dem Feld je Programm"]]}]}, {"slide": 2, "title": "Prüfen, ob das Vorbild selbst gültig ist", "short": "Prüfen, ob das Vorbild selbst gültig ist", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Eine einfache Prüfung hat zwei der Fehler aufgedeckt: Jedes Vorbild wird selbst als Lösung in die Bewertung gegeben. Besteht es nicht, kann die Rekonstruktion es nie als gültig finden, und der Fehler liegt in den Regeln oder in der Übersetzung, nicht in der Suche. Seit den Korrekturen bestehen alle 20 Vorbilder."}]}], "bericht": true}, {"id": "k9", "title": "Versuche zur Verbesserung", "goal": "Formgene, Inseln, Recherche und getestete Vorschläge.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_fig_balken.webp", "units": [{"slide": 1, "title": "Generische Formgene", "short": "Generische Formgene", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Die starre Raumform übernimmt Form und Maße aus dem Vorbild. Für ein generisches Verfahren, mit dem sich viele verschiedene Grundrisse nachgenerieren lassen, ist das zu speziell. Wir haben deshalb parametrische Raumformen als Gene erprobt: Jeder Raum mit genug Fläche kann Rechteck, L, T, Kreuz/I oder U werden, beschrieben durch Seite, Armbreite, Flächenanteil und Aufteilung der Arme. Ein seltener Formwechsel und ein Drift der Parameter mischen Formen ein, die Selektion entscheidet. Auch ein Inselmodell haben wir versucht, je eine Teilpopulation pro Formtyp mit Austausch der Besten. Ergebnis: Beide finden gültige Pläne, rekonstruieren die zusammengesetzten Säle aber deutlich schlechter als die übernommene Form, das Inselmodell zudem fünfmal langsamer. Die Form muss gleichzeitig mit der Anordnung gefunden werden, und der Raum aus Formtyp und Parametern ist groß."}, {"t": "table", "kopf": ["Vorbild", "Formgene", "Formgene mit Inseln", "übernommene Form"], "zeilen": [["Malcontenta", "76 %", "76 %", "93–99 %"], ["Saraceno", "63 %", "63 %", "92–100 %"], ["Pisani", "49 %", "31 %", "77–88 %"]]}]}, {"slide": 2, "title": "Was die Literatur vorschlägt", "short": "Was die Literatur vorschlägt", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Eine Recherche nach Verbesserungen für evolutionäre Grundrissgeneratoren ergab zwölf umsetzbare Vorschläge, darunter: Annahme schlechterer Zwischenstände und Raumtausch nach [Merrell, Schkufza und Koltun (2010)](https://www.cs.princeton.edu/courses/archive/spring11/cos598A/pdfs/Merrell10a.pdf) und [Burke und Bykov (2017)](https://doi.org/10.1016/j.ejor.2016.07.012); Raumgruppen spiegeln, Wände ausrichten und frische Individuen aus EPSAP von [Rodrigues, Gaspar und Gomes (2013)](https://doi.org/10.1016/j.cad.2013.01.001); erst die Topologie kraftbasiert auslegen, dann packen, nach [Guo und Li (2017)](https://doi.org/10.1016/j.foar.2016.11.003) und [Fruchterman und Reingold (1991)](https://doi.org/10.1002/spe.4380211102); Räume schrittweise in Teile aufspalten nach [Wu et al. (2018)](https://doi.org/10.1111/cgf.13380); eine graphentheoretische Vorprüfung nach [Pinki, Shekhawat und Lal (2025)](https://doi.org/10.1017/S0890060424000179); und Unterteilung statt Packung nach [Knecht und König (2014)](https://doi.org/10.1017/S0890060414000237), für Palladio auch als Unterteilungsgrammatik bei [Benrós, Duarte und Hanna (2012)](https://doi.org/10.1260/1478-0771.10.4.521). Einen Überblick gibt [Weber, Mueller und Reinhart (2022)](https://doi.org/10.1016/j.autcon.2022.104385)."}]}, {"slide": 3, "title": "Getestet", "short": "Getestet", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Sieben der Vorschläge haben wir eingebaut, schaltbar, und an den schweren Fällen gemessen, zuletzt an allen 20 Vorbildern mit je vier Suchreihen."}, {"t": "table", "kopf": ["Vorschlag", "Wirkung"], "zeilen": [["Spätannahme in der Nachbesserung (Late Acceptance)", "schadet deutlich, die Nachbesserung findet seltener zurück zu einem gültigen Plan"], ["Topologie zuerst (kraftbasierte Startlage)", "schadet"], ["frische Zufallspläne je Generation", "schadet"], ["Wände ausrichten", "neutral"], ["feste Räume im Plan unantastbar", "gemischt"], ["Raumgruppe spiegeln (2 %)", "Malcontenta von 25 auf 63 % im Mittel, andere verlieren"], ["Wände am fertigen Plan verschieben", "Siza Erdgeschoss Ab von 83 auf 90 %, sonst neutral"], ["beide letzten zusammen, alle 20 Vorbilder", "Mittel 75,6 → 75,9 %, Reihen mit Treffer 69 → 71 von 80: im Rauschen"], ["schrittweise aufspalten (erst ein Rechteck je Raum, nach 100 bzw. 200 Generationen in Teile zerlegt), 10 Vorbilder", "58,0 bzw. 54,7 % gegen 62,5 % ohne: schadet, nur Pisani gewinnt"]]}]}, {"slide": 4, "title": "Schalter in der App, abgestimmt über zwei Saatgruppen", "short": "Schalter in der App, abgestimmt über zwei Saatgruppen", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Raumgruppe spiegeln (als Rate) und Wände verschieben sind seit dem 25.11.2026 Regler der App, damit sich das Prinzip weiter nutzen lässt. Abgestimmt wurden sie je Vorbild über vier Suchreihen, zusammen mit der starren Raumform, und jede Wahl wurde an vier frischen Saaten gegengeprüft. Von sieben zunächst gewählten Schaltern hielten nur drei der Gegenprobe stand; viel stärker wirkte die Raumform:"}, {"t": "table", "kopf": ["Vorbild", "neu voreingestellt", "Saaten 1–151", "Saaten 201–351"], "zeilen": [["Malcontenta", "frei + Raumgruppe spiegeln", "25 → 74 %", "25 → 74 %"], ["Siza Ab, EG", "frei + Raumgruppe spiegeln", "83 → 94 %", "62 → 92 %"], ["Siza Ab, OG", "starr + Raumgruppe spiegeln", "68 → 73 %", "69 → 71 %"], ["Siza vier Zimmer, OG", "frei", "22 → 48 %", "23 → 57 %"], ["Siza Bb, OG", /* Breite der Gliederung: Ziehen an der Trennlinie, Pfeiltasten, Doppelklick = Standard; bleibt im Browser gespeichert */
const OLW_KEY = "infau-outline-width", OLW = { std: 300, min: 180, max: 560 };
const setOlw = w => { w = Math.round(Math.min(OLW.max, Math.max(OLW.min, w))); document.documentElement.style.setProperty("--ol-w", w + "px"); return w; };
const saveOlw = w => { try { w === OLW.std ? localStorage.removeItem(OLW_KEY) : localStorage.setItem(OLW_KEY, String(w)); } catch (e) {} };
try { const w = +localStorage.getItem(OLW_KEY); if (w) setOlw(w); } catch (e) {}
function bindOutlineResize() {
  const h = $("#olresize"); if (!h) return;
  const cur = () => $("#outline").getBoundingClientRect().width;
  const aria = () => { h.setAttribute("aria-valuenow", Math.round(cur())); h.setAttribute("aria-valuemin", OLW.min); h.setAttribute("aria-valuemax", OLW.max); };
  aria();
  h.addEventListener("pointerdown", e => {
    if (e.button) return;
    e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add("drag"); document.body.classList.add("ol-dragging");
    const left = h.parentElement.getBoundingClientRect().left;
    let w = cur();
    const move = ev => { w = setOlw(ev.clientX - left); };
    const up = () => { h.removeEventListener("pointermove", move); h.classList.remove("drag"); document.body.classList.remove("ol-dragging"); saveOlw(w); aria(); };
    h.addEventListener("pointermove", move);
    h.addEventListener("pointerup", up, { once: true }); h.addEventListener("pointercancel", up, { once: true });
  });
  h.addEventListener("dblclick", () => { saveOlw(setOlw(OLW.std)); aria(); });
  h.addEventListener("keydown", e => {
    const d = { ArrowLeft: -20, ArrowRight: 20 }[e.key];
    if (d) { e.preventDefault(); saveOlw(setOlw(cur() + (e.shiftKey ? d * 3 : d))); aria(); }
    else if (e.key === "Home" || e.key === "Enter") { e.preventDefault(); saveOlw(setOlw(OLW.std)); aria(); }
  });
}

/* Wo liegt das Icon in Rhino? (Standard-Oberfläche: Seitenleiste links, Registerkarten oben, Ausklapp-Leisten) */
const whereTxt = w => w.map(r => r.pfad.length
  ? `${esc(r.wo)} › kleines Dreieck am Icon <b>${esc(r.pfad[0])}</b> › <b>${esc(r.tip)}</b>`
  : `${esc(r.wo)} › <b>${esc(r.tip)}</b>`).join(" <span class=\"oder\">oder</span> ");
const where = i => i.where && i.where.length ? `<span class="wo"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 11s-3.6-3.4-3.6-6A3.6 3.6 0 0 1 9.6 5C9.6 7.6 6 11 6 11Z"/><circle cx="6" cy="5" r="1.2"/></svg><span>In ${esc(i.whereProg || "Rhino")}: ${whereTxt(i.where)}</span></span>` : "";
const ico = i => i.icon ? `<span class="ico" title="${esc(i.iconTitle)}"><img class="ico-l" src="${i.icon}" alt="" width="26" height="26"><img class="ico-d" src="${i.iconDark}" alt="" width="26" height="26"></span>` : `<span class="ico"></span>`;
/* Selbstprüfung: „**Frage?** Antwort“ – die Antwort steckt in einer aufklappbaren Box */
const quizText = s => { const m = /^\*\*([^*]+\?)\*\* (.+)$/s.exec(s);
  return m ? `<strong>${md(m[1])}</strong><details class="antwort"><summary><span class="zu">Antwort anzeigen</span><span class="auf">Antwort ausblenden</span></summary><p>${md(m[2])}</p></details>` : md(s); };
function stepList(items, cls = "steps", quiz = false) {
  let n = 0, prevNum = false;
  const icons = items.some(i => i.icon);
  return `<ol class="${cls}${icons ? " has-ico" : ""}">` + items.map(i => {
    if (/^`[^`]+`$/.test(i.md) && i.md === i.md.toUpperCase() && i.n === null) return `<li class="h"><b>${esc(i.md.slice(1, -1))}</b></li>`;
    if (i.n !== null && i.n !== undefined) { prevNum = true; return `<li><span class="n">${i.n}</span>${icons ? ico(i) : ""}<span>${quiz ? quizText(i.md) : md(i.md)}${where(i)}</span></li>`; }
    if (prevNum) return `<li class="sub"><span></span><span class="s-mark"></span><span>${md(i.md)}</span></li>`;
    return `<li><span class="n b"></span>${icons ? ico(i) : ""}<span>${md(i.md)}${where(i)}</span></li>`;
  }).join("") + "</ol>";
}

/* Videos: Vorschaubild und Hinweis, bis man einem Anbieter einmal zustimmt; die Zustimmung gilt danach für alle Videos dieses Anbieters und wird im Browser gemerkt */
const VKEY = "infau-videos-ok", VNAME = { vimeo: "Vimeo", youtube: "YouTube" };
let vok = {};
try { vok = JSON.parse(localStorage.getItem(VKEY) || "{}") || {}; } catch (e) { vok = {}; }
const vsrc = (v, auto) => (v.provider === "vimeo"
  ? `https://player.vimeo.com/video/${v.id}?${v.h ? "h=" + v.h + "&" : ""}dnt=1`
  : `https://www.youtube-nocookie.com/embed/${v.id}?rel=0`) + (auto ? "&autoplay=1" : "");
const vframe = (src, title) => `<iframe src="${src}" title="${esc(title || "Video")}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
const vdur = s => s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} min` : "";
function video(v) {
  const cap = [v.title, vdur(v.dur), v.by].filter(Boolean).map(esc).join(" · ");   /* by: z. B. „Lecturer: …“, vom Bau-Skript gesetzt */
  if (v.provider === "datei") return `<figure class="video"><div class="v-box"><video controls preload="metadata" src="${esc(v.src)}"></video></div></figure>`;
  const inner = vok[v.provider] ? vframe(vsrc(v), v.title)
    : `<button class="v-start" type="button" data-vstart="${v.provider}" data-src="${esc(vsrc(v, true))}" data-title="${esc(v.title)}" aria-label="Video abspielen: ${esc(v.title)}">
        ${v.poster ? `<img src="${v.poster}" alt="" loading="lazy">` : ""}
        <span class="v-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5v17l14-8.5z"/></svg></span>
        <span class="v-note">Video von ${VNAME[v.provider]} abspielen. Damit stimmst du zu, dass ${VNAME[v.provider]} Daten erhält. Die Entscheidung wird in diesem Browser gespeichert und gilt für alle Videos von ${VNAME[v.provider]}.</span></button>`;
  return `<figure class="video"><div class="v-box">${inner}</div>${cap ? `<figcaption>${cap}</figcaption>` : ""}</figure>`;
}
function vstart(b) {
  const prov = b.dataset.vstart;
  vok[prov] = true;
  try { localStorage.setItem(VKEY, JSON.stringify(vok)); } catch (e) {}
  document.querySelectorAll(`[data-vstart="${prov}"]`).forEach(x => {
    x.outerHTML = vframe(x === b ? x.dataset.src : x.dataset.src.replace(/&autoplay=1$/, ""), x.dataset.title);
  });
  vrevoke();
}
/* Widerruf in der Fußzeile, sobald einem Anbieter zugestimmt wurde */
function vrevoke() {
  const f = $(".site-foot .wrap"); if (!f) return;
  let s = $("#v-revoke");
  const on = Object.keys(vok).filter(k => vok[k]);
  if (!on.length) { if (s) s.remove(); return; }
  if (!s) { s = document.createElement("span"); s.id = "v-revoke"; f.appendChild(s); }
  s.innerHTML = `Videos von ${on.map(k => VNAME[k]).join(" und ")} laden automatisch · <button class="v-revoke" type="button">Zustimmung widerrufen</button>`;
  s.querySelector("button").addEventListener("click", () => { vok = {}; try { localStorage.removeItem(VKEY); } catch (e) {} vrevoke(); route(); toast("Videos laden wieder erst nach Zustimmung"); });
}

/* Bericht: Blöcke (Absatz, Überschrift, Liste, Tabelle, Abbildung, Prompt) in einer Lesespalte; Statusmarker [V] … [A] gedämpft */
const mdb = s => md(s).replace(/\[([VSRFA])\](?!\()/g, '<span class="st">[$1]</span>').replace(/\(korr\.\)/g, '<span class="st">(korr.)</span>');
const dlList = u => u.downloads && u.downloads.length ? `<div class="dl"><span class="label">Dateien zum Herunterladen</span>${u.downloads.map(f =>
        `<a class="dl-item" href="${f.href}" download><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0L4.8 6.8M8 10l3.2-3.2M2.5 12.5v1h11v-1"/></svg><span><b>${esc(f.kind)}</b> · ${esc(f.desc)}<span class="meta">${esc(f.name)} · ${esc(f.size || String(f.mb).replace(".", ",") + " MB")}</span></span></a>`).join("")}</div>` : "";
function renderBloecke(u) {
  const b = x => x.t === "p" ? `<p>${mdb(x.md)}</p>` : x.t === "h" ? `<h3>${mdb(x.md)}</h3>`
    : x.t === "ul" || x.t === "ol" ? `<${x.t}>${x.items.map(i => `<li>${mdb(i)}</li>`).join("")}</${x.t}>`
    : x.t === "table" ? `<div class="tab-wrap"><table><thead><tr>${x.kopf.map(c => `<th>${mdb(c)}</th>`).join("")}</tr></thead><tbody>${x.zeilen.map(r => `<tr>${r.map(c => `<td>${mdb(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
    : x.t === "fig" ? `<figure><button class="frame" type="button" data-zoom="${x.src}" aria-label="Bild vergrößern"><img src="${x.src}" width="${x.w}" height="${x.h}" alt="" loading="lazy"></button><figcaption><b>Abb. ${x.nr}</b> · ${mdb(x.cap)}<span class="quelle">Quelle: ${mdb(x.quelle)}</span></figcaption></figure>`
    : x.t === "prompt" ? `<div class="prompt"><div class="prompt-h"><span class="label">${esc(x.label)}</span><button class="btn sm" type="button" data-copy>Kopieren</button></div><pre>${esc(x.text)}</pre></div>`
    : "";
  return `<div class="bericht">${dlList(u)}${u.bloecke.map(b).join("")}</div>`;
}
function body(u) {
  if (u.bloecke && u.bloecke.length) return renderBloecke(u);
  const strips = u.images.filter(i => i.strip), pics = u.images.filter(i => !i.strip), vids = (u.app ? [{ app: 1 }] : []).concat(u.videos || []);
  /* Kästen (Übersichten): mit Bildern unter den Bildern in der Bildspalte, damit die Textspalte kurz bleibt;
     schmal (eine Spalte) nach dem Text. Ohne Bilder bleiben sie in der Textspalte. */
  /* app: eingebettete Demo-App (build.py app_of), steht vor den Bildern in der Bildspalte */
  /* „In eigenem Fenster öffnen“ steht als Knopf in der App selbst, neben „Zurücksetzen“ (Wunsch Nutzer 5.11.2026) */
  const app = u.app ? `<figure class="app-embed"><iframe src="${esc(u.app.src)}" title="${esc(u.app.title)}" style="height:${u.app.h}px" allow="fullscreen" allowfullscreen loading="lazy"></iframe></figure>` : "";
  const hasMedia = vids.length || strips.length || pics.length;
  const boxes = cls => u.boxes.length ? `<div class="boxes ${cls}">${u.boxes.map(b => stepList(b)).join("")}</div>` : "";
  const fig = pics.length > 1 && !u.stack && pics.every(i => i.w / i.h < 2.2) ?   /* stack: untereinander, zum Vergleich */ `<div class="row2">${pics.map(img).join("")}</div>` : pics.map(img).join("");
  /* groups: Bildgruppen (Anzahl Bilder je Gruppe), jede mit ihrer gemeinsamen Bildunterschrift darunter */
  const gruppen = (u.groups || []).length ? u.groups.map((n, g) => { const a = u.groups.slice(0, g).reduce((x, y) => x + y, 0);
    return `<div class="gruppe">${pics.slice(a, a + n).map(img).join("")}${u.captions[g] ? `<figcaption>${md(u.captions[g])}</figcaption>` : ""}</div>`; }).join("") : "";
  /* Fehlersuche: Auflösung aufklappbar unter dem Suchbild (Bildspalte) */
  const loes = u.loesung ? `<details class="loesung"><summary><span class="zu">Auflösung anzeigen</span><span class="auf">Auflösung ausblenden</span></summary>
        ${img(u.loesung.image)}<span class="label">Die ${u.loesung.steps.length} Fehler</span>${stepList(u.loesung.steps)}</details>` : "";
  const media = (vids.length || strips.length || pics.length) ? `<div class="media">
      ${vids.map(v => v.app ? app : video(v)).join("")}
      ${strips.map(s => `<div class="strip" title="Infofenster des markierten Bauteils"><img src="${s.src}" alt="Infofenster"></div>`).join("")}
      ${gruppen || fig}
      ${u.labels.length ? `<span class="labels">${u.labels.map(esc).join(" · ")}</span>` : ""}
      ${gruppen ? "" : u.captions.map(c => `<figcaption>${md(c)}</figcaption>`).join("")}
      ${loes}
      ${orient(u)}
      ${boxes("b-media")}
    </div>` : `<div class="media">${u.captions.map(c => `<figcaption>${md(c)}</figcaption>`).join("")}${loes}${orient(u)}</div>`;
  const prompts = u.prompts && u.prompts.length ? `<div class="prompts">${u.prompts.map(pr => `<div class="prompt"><div class="prompt-h"><span class="label">${esc(pr.label)}</span><button class="btn sm" type="button" data-copy>Kopieren</button></div><pre>${esc(pr.text).replace(/&lt;([^&]+)&gt;/g, "<mark>&lt;$1&gt;</mark>")}</pre></div>`).join("")}</div>` : "";
  const text = `<div class="text">
      ${u.notes ? `<div class="why"><span class="label">Worum es geht</span><p>${CURAPP ? md(u.notes) : esc(u.notes)}</p></div>` : ""}
      ${u.actions && u.actions.length ? `<div class="acts">${u.actions.map(a => `<a class="btn primary" href="${a.href}" target="_blank" rel="noopener">${esc(a.label)}</a>`).join("")}</div>` : ""}
      ${u.downloads && u.downloads.length ? `<div class="dl"><span class="label">Dateien zum Herunterladen</span>${u.downloads.map(f =>
        `<a class="dl-item" href="${f.href}" download><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0L4.8 6.8M8 10l3.2-3.2M2.5 12.5v1h11v-1"/></svg><span><b>${esc(f.kind)}</b> · ${esc(f.desc)}<span class="meta">${esc(f.name)} · ${esc(f.size || String(f.mb).replace(".", ",") + " MB")}</span></span></a>`).join("")}</div>` : ""}
      ${u.promptsFirst ? prompts : ""}
      ${u.steps.length ? `<div><span class="label" style="display:block;margin-bottom:10px;color:var(--muted)">${u.promptsFirst ? "Darauf achten" : /SELBST PRÜFEN/i.test(u.short) ? "Fragen" : "So geht's"}</span>${stepList(u.steps, "steps", /SELBST PRÜFEN/i.test(u.short))}</div>` : ""}
      ${u.promptsFirst ? "" : prompts}
      ${u.kontrolle ? `<div class="kontrolle"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="7.6"/><path d="m5.6 9.2 2.3 2.3 4.6-4.8"/></svg><span class="label">Kontrolle</span><p>${md(u.kontrolle)}</p></div>` : ""}
      ${u.fehler.length ? `<details class="klappt"><summary class="label">Klappt nicht?</summary><ul>${u.fehler.map(f => `<li><b>${md(f.wenn)}</b><span>${md(f.dann)}</span></li>`).join("")}</ul></details>` : ""}
      ${boxes(hasMedia ? "b-text" : "")}
      ${u.hints.map(h => `<p class="hint">${md(h)}</p>`).join("")}
    </div>`;
  return `<div class="content">${vids.length || pics.length || strips.length ? media + text : text + media}</div>`;
}
/* Orientierung: wo liegen die Icons dieses Schritts in der Rhino-Oberfläche? */
const orient = u => u.orient && u.orient.length ? `<div class="orient"><span class="label">${u.orientLabel || "So findest du die Icons"}</span>${u.orient.map(o =>
  `<figure><button class="frame dark" type="button" data-zoom="${o.src}" aria-label="Bild vergrößern"><img src="${o.src}" width="${o.w}" height="${o.h}" alt="" loading="lazy"></button><figcaption><code class="cmd">${esc(o.cmd)}</code> ${esc(o.ort)}</figcaption></figure>`).join("")}</div>` : "";
const img = i => `<figure><button class="frame" type="button" data-zoom="${i.src}" aria-label="Bild vergrößern"><img src="${i.src}" width="${i.w}" height="${i.h}" alt=""></button></figure>`;

/* ---------- Problem melden ----------
   Speicher: db-Dokument meldungen/<Betrachter-ID> = {items: [...]}.
   Jede Person schreibt nur ihr eigenes Dokument; lesen dürfen alle Dokumente nur Editoren und der Besitzer. */
const ISSUE_URL = null;   /* GitLab-Fassung: Meldung als vorausgefülltes Issue */
const KATS = ["Anleitung unklar", "Ergebnis stimmt nicht", "Programm verhält sich anders", "Sonstiges"];
let DB = null, MYID = null, CANWRITE = null, IS_OWNER = false, CAN_READ_ALL = false, INIT = false, ALL = [];
const lbl = s => `<span class="label" style="color:var(--muted)">${s}</span>`;

function reportForm(titel) {
  return `<details class="report" id="report"><summary class="label"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 14.5V2m0 0h8.5l-1.6 3 1.6 3H3"/></svg>${titel || "Problem mit diesem Schritt melden"}</summary>
    <form id="rform" novalidate>
      <p>Etwas ist unklar oder funktioniert nicht wie beschrieben? Beschreibe kurz, was du gemacht hast und was passiert ist. ${ISSUE_URL ? "Die Meldung wird als Issue im GitLab der Uni angelegt; dafür brauchst du dort ein Konto. Issues sind öffentlich sichtbar, also bitte keine persönlichen Daten eintragen. Ohne Konto: Text kopieren und per Mail oder Moodle an die Betreuung schicken." : "Die Meldung geht an die Betreuung der Tutorials."}</p>
      <fieldset class="chips"><legend>${lbl("Art des Problems")}</legend>${KATS.map((k, i) => `<label><input type="radio" name="kat" value="${esc(k)}" ${i ? "" : "checked"}>${esc(k)}</label>`).join("")}</fieldset>
      <label class="fld">${lbl("Was ist passiert?")}<textarea name="text" maxlength="4000" placeholder="z. B. Nach CurveBoolean entsteht nur eine Kurve statt drei."></textarea></label>
      <div class="row-2">
        <label class="fld">${lbl("Programmversion, System (freiwillig)")}<input name="sys" maxlength="200" placeholder="z. B. Rhino 8, Windows 11"></label>
        ${ISSUE_URL ? "" : `<label class="fld">${lbl("Name oder E-Mail für Rückfragen (freiwillig)")}<input name="kontakt" maxlength="200"></label>`}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <button class="btn primary" type="submit" id="rsend">${ISSUE_URL ? "In GitLab melden" : "Meldung senden"}</button>
        <button class="btn" type="button" id="rcopy" hidden>Text kopieren</button>
        <span class="status" id="rstatus" role="status" aria-live="polite"></span>
      </div>
    </form></details>`;
}

function reportMode() {
  const send = $("#rsend"); if (!send) return;
  if (ISSUE_URL) { $("#rcopy").hidden = false; return; }
  if (!INIT) return;
  if (!DB || !MYID || CANWRITE === false) {
    send.hidden = true; $("#rcopy").hidden = false;
    $("#rstatus").textContent = "Speichern ist in dieser Ansicht nicht möglich. Kopiere den Text und schicke ihn per Mail oder Moodle an die Betreuung.";
  }
}

function bindReport(p, t, u) {
  const f = $("#rform"); if (!f) return;
  const st = $("#rstatus"), send = $("#rsend"), copy = $("#rcopy");
  const ctx = { prog: p.name, thema: t.title, folie: u.slide, einheit: shortTitle(u), link: `#${p.id}-${t.id}-${u.slide}` };
  const val = n => String(new FormData(f).get(n) || "").trim();
  const asText = () => [`${ctx.prog} › ${ctx.thema} › ${ctx.einheit} [${ctx.link.slice(1)}]`, `Art: ${val("kat")}`, val("text"),
    val("sys") && `System: ${val("sys")}`, val("kontakt") && `Kontakt: ${val("kontakt")}`].filter(Boolean).join("\n");
  copy.addEventListener("click", () => {
    try { navigator.clipboard.writeText(asText()).then(() => toast("Meldung kopiert"), () => toast("Kopieren nicht möglich")); } catch (e) { toast("Kopieren nicht möglich"); }
  });
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const msg = val("text");
    st.className = "status";
    if (msg.length < 5) { st.textContent = "Bitte kurz beschreiben, was passiert ist."; f.elements.text.focus(); return; }
    if (ISSUE_URL) {
      const where = `${ctx.prog} › ${ctx.thema} › ${ctx.einheit}`;
      const title = `${where}: ${val("kat")}`;
      const ref = "tut" + Math.random().toString(36).slice(2, 9);     /* eindeutige Meldungs-Nr., um das Issue wiederzufinden */
      const desc = [`**Schritt:** ${where}`, `**Seite:** ${location.origin}${location.pathname}${ctx.link}`, `**Art:** ${val("kat")}`, "", msg.slice(0, 2500),
        val("sys") ? `\n**System:** ${val("sys")}` : "", "", `<sub>Folie ${ctx.folie} · Meldungs-Nr. ${ref}</sub>`].join("\n");
      window.open(`${ISSUE_URL}?issue[title]=${encodeURIComponent(title)}&issue[description]=${encodeURIComponent(desc)}`, "_blank", "noopener");
      f.reset(); $("#report").open = false;
      watchIssue(ref);
      return;
    }
    send.disabled = true; st.textContent = "Wird gesendet …";
    await READY;
    if (!DB || !MYID || CANWRITE === false) { send.disabled = false; reportMode(); return; }
    const now = new Date().toISOString();
    const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: now, ...ctx,
      kat: val("kat"), text: msg.slice(0, 4000), sys: val("sys").slice(0, 200), kontakt: val("kontakt").slice(0, 200), status: "offen" };
    try {
      const ref = DB.doc("meldungen/" + MYID);
      const snap = await ref.get();
      const old = snap.exists && Array.isArray(snap.data().items) ? snap.data().items.slice(-199) : [];
      await ref.set({ items: [...old, item], updated: now });
      f.reset(); $("#report").open = false;
      notice("Meldung gespeichert", "Danke! Die Betreuung sieht deine Meldung zu diesem Schritt.");
    } catch (err) {
      const c = err && err.code;
      if (c === "invalid_argument" || c === "not_granted" || c === "revoked") { CANWRITE = false; reportMode(); }
      else if (c === "quota_exceeded") { st.textContent = "Der Speicher für Meldungen ist voll. Bitte den Text kopieren und per Mail schicken."; copy.hidden = false; }
      else st.textContent = "Senden hat nicht geklappt. Bitte später noch einmal versuchen.";
    } finally { send.disabled = false; }
  });
  reportMode();
}

/* Hinweis unten rechts (bleibt stehen, bis man ihn schließt; überlebt den Wechsel der Lerneinheit) */
function notice(head, html) {
  $("#notice-h").textContent = head; $("#notice-t").innerHTML = html; $("#notice").hidden = false;
}
$("#notice-x").addEventListener("click", () => { $("#notice").hidden = true; });

/* GitLab-Fassung: nach dem Öffnen des Issue-Formulars prüfen, ob das Issue angelegt wurde.
   Die Issues des öffentlichen Projekts sind ohne Anmeldung lesbar; gesucht wird die Meldungs-Nr. */
let issueWatch = null;
function watchIssue(ref) {
  clearInterval(issueWatch);
  const u = new URL(ISSUE_URL), path = u.pathname.replace(/\/-\/issues\/new$/, "").replace(/^\//, "");
  const api = `${u.origin}/api/v4/projects/${encodeURIComponent(path)}/issues?in=description&per_page=1&search=${ref}`;
  notice("Fast fertig", "GitLab ist in einem neuen Tab geöffnet. Melde dich dort an und klicke auf <b>Create issue</b> – danach erscheint hier eine Bestätigung.");
  const t0 = Date.now();
  const check = async () => {
    if (Date.now() - t0 > 20 * 60 * 1000) {
      clearInterval(issueWatch); window.removeEventListener("focus", check);
      notice("Keine Bestätigung", "Bei GitLab ist kein Issue angekommen. Falls du nicht auf <b>Create issue</b> geklickt hast, melde das Problem bitte noch einmal.");
      return;
    }
    try {
      const r = await fetch(api, { cache: "no-store" });
      const js = r.ok ? await r.json() : [];
      if (Array.isArray(js) && js.length) {
        clearInterval(issueWatch); window.removeEventListener("focus", check);
        const is = js[0];
        notice("Meldung angekommen", `Danke! Dein Problem ist als <a href="${esc(is.web_url)}" target="_blank" rel="noopener">Issue #${esc(is.iid)}</a> angelegt. Wir melden uns dort.`);
        toast("Issue #" + is.iid + " angelegt");
      }
    } catch (e) { /* Netz kurz weg: beim nächsten Durchlauf erneut */ }
  };
  issueWatch = setInterval(check, 5000);
  window.addEventListener("focus", check);
}

/* Hell/Dunkel: folgt der Systemeinstellung, bis man umschaltet; die Wahl merkt sich der Browser */
const THEME_KEY = "infau-tutorials-theme";
const SUN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>';
const MOON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1Z"/></svg>';
const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
function paintThemeBtn() {
  const dark = isDark();
  $("#theme").innerHTML = (dark ? SUN : MOON) + `<span class="t-txt">${dark ? "Hell" : "Dunkel"}</span>`;
  $("#theme").setAttribute("aria-label", dark ? "Zur hellen Darstellung wechseln" : "Zur dunklen Darstellung wechseln");
}
try { const t = localStorage.getItem(THEME_KEY); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
paintThemeBtn();
$("#theme").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  paintThemeBtn();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);

/* Umschalter De/En: DATA.lang = { aktuell, ziel, en: [Programm-IDs mit Übersetzung], titel, fehlt }.
   Ohne DATA.lang (OLP, KI Lernlabor, Offline-Fassung) bleibt der Knopf verborgen. Die Fassungen sind zwei Dateien mit gleichen Ankern. */
function paintLang(h) {
  const L = DATA.lang, a = $("#lang");
  if (!L) return;
  const pid = h.split("-")[0], ok = !DATA.programs.some(p => p.id === pid) || L.en.includes(pid);
  a.hidden = false;
  a.innerHTML = L.aktuell === "de" ? "<span><b>DE</b> / EN</span>" : "<span>DE / <b>EN</b></span>";
  a.classList.toggle("aus", !ok);
  a.title = ok ? L.titel : L.fehlt;
  if (ok) { a.href = L.ziel + location.hash; a.removeAttribute("aria-disabled"); }
  else { a.removeAttribute("href"); a.setAttribute("aria-disabled", "true"); }
}

/* Übersicht der Meldungen: nur für Editoren und Besitzer; Status ändern nur der Besitzer */
const fmtDate = s => { try { return new Date(s).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return s; } };
const safeLink = s => /^#[a-z0-9-]+$/i.test(String(s)) ? s : "#";
function meldungen() {
  crumbs([{ t: "Übersicht", href: "#" }, { t: "Meldungen" }]);
  if (!CAN_READ_ALL) {
    app.innerHTML = `<div class="wrap"><section class="ph"><div><h1>Meldungen</h1><p>Die Meldungen sind nur für die Betreuung sichtbar.</p></div></section></div>`;
    return;
  }
  const offen = ALL.filter(m => m.status !== "erledigt").length;
  app.innerHTML = `<div class="wrap">
    <section class="ph"><div><span class="label" style="color:var(--accent-text)">Rückmeldungen zu den ${APPS_MODE ? "Apps" : "Tutorials"}</span><h1>Meldungen</h1>
      <p>${ALL.length ? `${offen} offen · ${ALL.length - offen} erledigt` : "Noch keine Meldungen."}</p></div></section>
    <section class="mel">${ALL.map(m => `<article class="${m.status === "erledigt" ? "erledigt" : ""}">
      <div style="display:grid;gap:6px;min-width:0">
        <span class="meta">${esc(fmtDate(m.ts))} · ${esc(m.kat)}</span>
        <h3><a href="${esc(safeLink(m.link))}">${esc(m.prog)} › ${esc(m.thema)} › ${esc(m.einheit)}</a> <span class="meta">Folie ${esc(m.folie)}</span></h3>
        <p>${esc(m.text)}</p>
        ${m.sys || m.kontakt ? `<span class="meta">${[m.sys, m.kontakt].filter(Boolean).map(esc).join(" · ")}</span>` : ""}
      </div>
      <div class="side">${IS_OWNER ? `<button class="btn" type="button" data-mstat="${esc(m._doc)}" data-mid="${esc(m.id)}">${m.status === "erledigt" ? "Wieder öffnen" : "Erledigt"}</button>` : `<span class="meta">${esc(m.status)}</span>`}</div>
    </article>`).join("")}</section></div>`;
}
async function toggleStatus(btn) {
  btn.disabled = true;
  try {
    const ref = DB.doc("meldungen/" + btn.dataset.mstat), snap = await ref.get();
    if (!snap.exists) return;
    const d = snap.data();
    await ref.set({ ...d, items: (d.items || []).map(it => it.id === btn.dataset.mid ? { ...it, status: it.status === "erledigt" ? "offen" : "erledigt" } : it) });
  } catch (e) { toast("Ändern hat nicht geklappt"); btn.disabled = false; }
}

const READY = (async () => {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    DB = db;
    if (user) {
      const ask = async (f, fb) => { try { return await f(); } catch (e) { return fb; } };
      MYID = await ask(() => user.id(), null);
      IS_OWNER = await ask(() => user.isOwner(), false);
      CAN_READ_ALL = await ask(() => user.canEdit(), false);
      CANWRITE = await ask(() => user.can("data.write"), null);
    }
    if (DB && CAN_READ_ALL) {
      const ml = $("#mlink");
      DB.collection("meldungen").onSnapshot(snap => {
        ALL = snap.docs.flatMap(d => ((d.data() || {}).items || []).map(it => ({ ...it, _doc: d.id })))
          .sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
        const offen = ALL.filter(m => m.status !== "erledigt").length;
        ml.hidden = false; ml.textContent = offen ? `Meldungen · ${offen}` : "Meldungen";
        if (location.hash === "#meldungen") meldungen();
      }, () => {});
    }
  } catch (e) { /* ohne Speicher: Formular bietet Kopieren an */ }
  finally { INIT = true; reportMode(); if (location.hash === "#meldungen") meldungen(); }
})();

/* ---------- Routing (#rhino, #rhino-02-41) ---------- */
function route() {
  const h = location.hash.replace(/^#/, "");
  /* Englische Fassung: Programme ohne Übersetzung öffnen auf der deutschen Seite */
  if (DATA.lang && DATA.lang.aktuell === "en" && DATA.programs.some(q => q.id === h.split("-")[0]) && !DATA.lang.en.includes(h.split("-")[0])) { location.replace(DATA.lang.ziel + location.hash); return; }
  /* Umgezogene Lernbereiche (21.11.2026): der alte Anker führt zur neuen Adresse (etwa entwurfsforschung.de); nur wenn DATA.weiterleitung gesetzt ist */
  if (DATA.weiterleitung && DATA.weiterleitung[h.split("-")[0]]) { location.replace(DATA.weiterleitung[h.split("-")[0]]); return; }
  paintLang(h);
  if (h === "meldungen") { meldungen(); window.scrollTo({ top: 0 }); return; }
  if (h === "probleme" && ISSUE_URL) { probleme(); window.scrollTo({ top: 0 }); return; }
  if (h === "apps" && (DATA.apps || []).length) { CURAPP = true; APPS_MODE ? appsHome() : appsPage(); window.scrollTo({ top: 0 }); return; }
  const [pid, tid, sl] = h.split("-");
  const p = findProg(pid);
  const neu = p && p.umzug && tid && p.umzug[tid + "-" + sl];   // verschobene Einheit: alter Anker führt zum neuen Ort
  if (neu) { location.replace(neu[0] === "#" ? neu : "#" + pid + "-" + neu); return; }   // "#…" = Ziel in einem anderen Bereich
  CURAPP = !!(p && p.app);
  const fa = $(".site-foot .wrap > span");   // Fußzeile: Autor des Lernbereichs, sonst der allgemeine
  if (fa) fa.textContent = DATA.ohneAutor ? "" : (p && p.autor) || "Autor: Prof. Dr. Reinhard König in Zusammenarbeit mit Claude von Anthropic";   // DATA.ohneAutor: Seiten mit Beiträgen mehrerer (Konzeptsammlung)
  if (!p) { DATA.offline ? program(DATA.programs[0]) : home(); }
  else if (!tid) { program(p); }
  else {
    const t = p.topics.find(x => x.id === tid) || p.topics[0];
    const idx = Math.max(0, t.units.findIndex(u => String(u.slide) === sl));
    learn(p, t, idx);
  }
  window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]");
  if (g && g.dataset.goto) { location.hash = g.dataset.goto; return; }
  const vs = e.target.closest("[data-vstart]");
  if (vs) { vstart(vs); return; }
  const ms = e.target.closest("[data-mstat]");
  if (ms) { toggleStatus(ms); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; route(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const txt = cp.closest(".prompt").querySelector("pre").textContent;
    const ok = () => { cp.textContent = "Kopiert ✓"; setTimeout(() => { cp.textContent = "Kopieren"; }, 1600); };
    try { navigator.clipboard.writeText(txt).then(ok, () => toast("Kopieren nicht möglich – Text markieren und mit Strg + C kopieren")); } catch (err) { toast("Kopieren nicht möglich – Text markieren und mit Strg + C kopieren"); }
    return;
  }
  const z = e.target.closest("[data-zoom]");
  if (z) { $("#zoom-img").src = z.dataset.zoom; $("#zoom").showModal(); return; }
  const c = e.target.closest("code.cmd");
  if (c) {
    const txt = c.textContent;
    const ok = () => toast("Kopiert: " + txt);
    try { navigator.clipboard.writeText(txt).then(ok, () => toast(txt)); } catch (err) { toast(txt); }
  }
});
$("#zoom-close").addEventListener("click", () => $("#zoom").close());
$("#zoom").addEventListener("click", e => { if (e.target.id === "zoom") $("#zoom").close(); });
let tt;
function toast(s) { const t = $("#toast"); t.textContent = s; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1600); }
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea") || $("#zoom").open) return;
  const btn = e.key === "ArrowRight" ? app.querySelector('.chev[aria-label="Nächster Schritt"]') : e.key === "ArrowLeft" ? app.querySelector('.chev[aria-label="Vorheriger Schritt"]') : null;
  if (btn && !btn.disabled) btn.click();
});
/* Bild beim ersten Abruf nicht geladen? Bis zu zwei weitere Versuche */
document.addEventListener("error", e => {
  const im = e.target;
  if (!(im instanceof HTMLImageElement) || !im.src) return;
  const n = +(im.dataset.retry || 0);
  if (n >= 2) return;
  im.dataset.retry = n + 1;
  const base = im.src.split("?")[0];
  setTimeout(() => { im.src = base + "?r=" + (n + 1); }, 500 * (n + 1));
}, true);
window.addEventListener("hashchange", () => { tab = "anleitung"; route(); });
route();
vrevoke();
</script>
