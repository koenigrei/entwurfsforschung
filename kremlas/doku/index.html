<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dokumentation des KREMLAS-Projekts: Herkunft, Neuumsetzung als Web-App, Nachgenerieren der Palladio-Villen und der Siza-Häuser, Versuche zur Verbesserung.">
<title>KREMLAS · Dokumentation · Entwurfsforschung</title>
<meta name="author" content="Prof. Dr. Reinhard König in Zusammenarbeit mit Claude von Anthropic">
<link rel="stylesheet" href="../../../schrift/geist.css">
<style>
/* Layout: Übersicht als Programmliste → Themen eines Programms → Lernansicht mit Gliederung links, Schritt-Fluss oben, Inhalt Mitte (wie edX-Kursseiten). InfAU: Linien statt Flächen, ein Akzent, Mono-Labels in Großbuchstaben. */
:root {
  --paper: #ffffff; --surface: #f2f2f2; --ink: #171717; --ink-2: #424242; --muted: #75757d;
  --line: #dededf; --inactive: #7f7f7f; --accent: #4649e1; --accent-text: #4649e1; --on-accent: #ffffff;
  --accent-tint: #d0d1f7; --done: #4649e1;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --head: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171717; --surface: #262626; --ink: #ffffff; --ink-2: #c9c9ce; --muted: #a3a3ab;
    --line: #3a3a3e; --inactive: #8c8c8c; --accent-text: #9ea0f3; --accent-tint: #2a2b55; --done: #9ea0f3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171717; --surface: #262626; --ink: #ffffff; --ink-2: #c9c9ce; --muted: #a3a3ab;
  --line: #3a3a3e; --inactive: #8c8c8c; --accent-text: #9ea0f3; --accent-tint: #2a2b55; --done: #9ea0f3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.label { font: 500 12px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.meta { font: 400 12px/16px var(--mono); letter-spacing: .02em; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- Kopfzeile ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { height: var(--head); display: flex; align-items: center; gap: 20px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
/* Wortmarke der Bauhaus-Universität Weimar im Farbfeld der Uni-Seite (Palette „themed--blue“, #478bff; passt zum Akzent) */
.uni { flex: none; display: block; background: #478bff; }
.uni-logo { height: 34px; width: auto; display: block; }   /* die Wortmarke bringt den Innenabstand des Farbfelds selbst mit */
/* Unter rund 400 px schrumpfen die Logos mit, sonst wird die Kopfzeile breiter als der Bildschirm (bis 280 px geprüft) */
@media (max-width: 560px) { .uni-logo { height: min(22px, 5.3vw); } .top-in { gap: 12px; } .infau .logo { height: min(20px, 4.8vw); } }
.infau { flex: none; display: block; margin-right: -6px; }   /* Logo zur Professur; 14 px Abstand zur Trennlinie wie zuvor */
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); flex: none; }
.logo { height: 26px; width: auto; display: block; }
.brand .label { color: var(--ink); padding-left: 14px; border-left: 1px solid var(--line); line-height: 26px; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs a, .crumbs span { text-decoration: none; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.crumbs a:hover { color: var(--accent-text); }
.crumbs .sep { color: var(--line); }
.crumbs .cur { color: var(--ink); }
@media (max-width: 560px) { .brand .label { display: none; } }

/* ---------- Übersicht ---------- */
.site-foot { border-top: 1px solid var(--line); margin-top: 48px; padding: 18px 0 calc(22px + env(safe-area-inset-bottom, 0px)); font: 400 12px/18px var(--mono); letter-spacing: .02em; color: var(--muted); }
.site-foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; }
.site-foot a { color: inherit; }
.ph .autor { margin: 14px 0 0; font: 400 12px/18px var(--mono); letter-spacing: .02em; color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.hero { padding-block: 56px 40px; display: grid; gap: 18px; }
.hero h1 { font: 500 clamp(30px, 4.4vw, 52px)/1.08 var(--sans); letter-spacing: -.01em; max-width: 18ch; }
.hero h1 em { font-style: normal; color: var(--accent-text); }
.hero p { margin: 0; max-width: 62ch; color: var(--ink-2); font-size: 18px; line-height: 26px; }
.hero .btn { white-space: normal; line-height: 1.35; }   /* lange Knopftexte umbrechen, sonst wird die Startseite auf dem Handy zu breit */
.flowline { display: flex; align-items: center; gap: 0; margin-top: 8px; flex-wrap: wrap; row-gap: 10px; }
.node { font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid var(--ink); border-radius: 999px; padding: 9px 14px; white-space: nowrap; }
.node.on { border-color: var(--accent); color: var(--accent-text); }
.node.off { border-style: dashed; border-color: var(--inactive); color: var(--inactive); }
.conn { width: 28px; height: 1.5px; background: var(--ink); flex: none; }
.conn.off { background: repeating-linear-gradient(90deg, var(--inactive) 0 5px, transparent 5px 10px); }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-block: 28px 14px; border-top: 1.5px solid var(--ink); }
.sec-head .label { color: var(--accent-text); }
.programs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px; padding-bottom: 40px; }
.prog { display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--line); text-decoration: none; color: inherit; background: var(--paper); transition: border-color .15s; }
.prog:hover { border-color: var(--ink); }
.prog-img { aspect-ratio: 16 / 9; background: var(--surface); display: grid; grid-template-columns: 1fr 1fr; gap: 1px; overflow: hidden; border-bottom: 1px solid var(--line); }
.prog-img img { width: 100%; height: 100%; object-fit: cover; display: block; background: #fff; }
.prog-img.one { grid-template-columns: 1fr; }   /* ein eigenes Titelbild je Programm (OLP: Kursbild von OTP) */
.prog-body { padding: 20px; display: grid; gap: 12px; align-content: start; }
.prog-body h2 { font: 500 26px/1.15 var(--sans); }
.prog-body p { margin: 0; color: var(--ink-2); }
/* DATA.card (OLP, Tutorials, KI Lernlabor): gleich hohe Kacheln – Text gekürzt, Fuß unten */
.prog-body.fest { display: flex; flex-direction: column; }
.prog-body.fest .prog-foot { margin-top: auto; }
.prog-body p.clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.topics-mini li.more span:first-child { color: var(--muted); }
.prog-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding-top: 6px; }
.prog-foot .go { margin-left: auto; color: var(--accent-text); font: 500 13px/1 var(--mono); letter-spacing: .04em; }
.topics-mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.topics-mini li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.topics-mini li span:last-child { font: 400 12px/20px var(--mono); color: var(--muted); white-space: nowrap; }
.soon { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; padding-bottom: 64px; }
.soon-item { border: 1.5px dashed var(--inactive); border-radius: 999px; padding: 14px 22px; display: grid; gap: 2px; color: var(--inactive); }
.soon-item b { font: 500 15px/1.3 var(--sans); color: var(--ink-2); }
a.soon-item { text-decoration: none; color: var(--muted); } a.soon-item:hover { border-color: var(--accent); } a.soon-item:hover b { color: var(--accent-text); }

/* ---------- Programmseite ---------- */
.ph { padding-block: 44px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.ph h1 { font: 500 clamp(30px, 4vw, 46px)/1.1 var(--sans); }
.ph p { margin: 10px 0 0; color: var(--ink-2); max-width: 60ch; font-size: 18px; line-height: 26px; }
.ph-side { display: grid; gap: 6px; text-align: right; }
.ph-dl { display: grid; gap: 8px; justify-items: end; margin-top: 10px; }
.ph-dl .btn { font-size: 12px; padding: 10px 12px; }
@media (max-width: 720px) { .ph { grid-template-columns: 1fr; } .ph-side { text-align: left; } .ph-dl { justify-items: start; } }
.topics { display: grid; gap: 0; padding-bottom: 64px; border-top: 1.5px solid var(--ink); }
.topic { display: grid; grid-template-columns: 56px 220px minmax(0, 1fr) 190px; gap: 24px; align-items: center; padding-block: 22px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.topic:hover .t-title { color: var(--accent-text); }
.t-num { font: 300 40px/1 var(--mono); color: var(--inactive); }
.t-img { aspect-ratio: 3 / 2; background: #fff; border: 1px solid var(--line); overflow: hidden; }
.t-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.t-body { display: grid; gap: 6px; min-width: 0; }
.t-title { font: 500 22px/1.2 var(--sans); transition: color .15s; }
.t-body p { margin: 0; color: var(--ink-2); font-size: 15px; }
.t-cmds { font: 400 12.5px/1.5 var(--mono); color: var(--muted); }
.t-cmds b { font-weight: 500; color: var(--accent-text); }
.t-side { display: grid; gap: 10px; justify-items: end; }
.bar { width: 100%; height: 4px; background: var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 12px 16px; border: 1.5px solid var(--ink); text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--accent-tint); border-color: var(--accent-text); color: var(--accent-text); }
.btn:disabled { opacity: .35; cursor: default; }
@media (max-width: 900px) {
  .topic { grid-template-columns: 44px minmax(0, 1fr); }
  .t-img { display: none; }
  .t-side { grid-column: 2; justify-items: start; }
}

/* ---------- Lernansicht ---------- */
.learn { display: grid; grid-template-columns: var(--ol-w, 300px) minmax(0, 1fr); min-height: calc(100% - var(--head)); position: relative; }
/* Breite der Gliederung per Ziehen an der Trennlinie; Doppelklick setzt zurück */
.ol-resize { position: absolute; top: 0; bottom: 0; left: calc(var(--ol-w, 300px) - 5px); width: 10px; z-index: 12; cursor: col-resize; touch-action: none; }
.ol-resize::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .15s; }
.ol-resize:hover::after, .ol-resize:focus-visible::after, .ol-resize.drag::after { background: var(--accent-text); }
.ol-resize:focus-visible { outline: 0; }
body.ol-dragging { cursor: col-resize; user-select: none; }
.outline { border-right: 1px solid var(--line); padding: 22px 0 40px var(--gutter-l); position: sticky; top: calc(var(--head) + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - var(--head)); overflow-y: auto; }
.ol-prog { padding-right: 18px; display: grid; gap: 4px; padding-bottom: 16px; }
.ol-prog b { font: 500 18px/1.2 var(--sans); }
a.ol-prog { color: inherit; text-decoration: none; }
a.ol-prog:hover b, a.ol-prog:focus-visible b { color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; }
.ol-topic { border-top: 1px solid var(--line); }
.ol-topic > button { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 18px 12px 0; font: 500 14px/1.3 var(--sans); }
.ol-topic > button .meta { align-self: center; }
.ol-topic.cur > button { color: var(--accent-text); }
.ol-units { list-style: none; margin: 0 0 10px; padding: 0; position: relative; }
.ol-units::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 1.5px; background: var(--line); }
.ol-units a { position: relative; display: grid; grid-template-columns: 16px 1fr; gap: 12px; padding: 6px 18px 6px 0; text-decoration: none; color: var(--ink-2); font-size: 13.5px; line-height: 1.35; }
.ol-units a:hover { color: var(--ink); }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--inactive); background: var(--paper); margin-top: 1px; position: relative; z-index: 1; }
.done .dot { border-color: var(--done); background: var(--done); }
.done .dot::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 4px; height: 8px; border: solid var(--paper); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.ol-units a.cur { color: var(--ink); font-weight: 500; }
.ol-units a.cur .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-tint); }

.main { min-width: 0; padding: 0 var(--gutter-r) 64px 40px; }
.seq { position: sticky; top: calc(var(--head) + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.seq-nodes { display: flex; align-items: center; overflow-x: auto; scrollbar-width: thin; padding: 4px 2px; min-width: 0; flex: 1; }
.sq { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border: 1.5px solid var(--inactive); color: var(--inactive); font: 500 12px/1 var(--mono); text-decoration: none; background: var(--paper); }
.sq.done { border-color: var(--done); color: var(--done); }
.sq.cur { border-color: var(--accent-text); background: var(--accent-tint); color: var(--accent-text); }
.sq-c { flex: none; width: 14px; height: 1.5px; background: var(--line); }
.chev { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border: 1.5px solid var(--ink); }
.chev:disabled { border-color: var(--line); color: var(--line); cursor: default; }
.chev svg { width: 14px; height: 14px; }
.toc-btn { display: none; }
@media (max-width: 960px) {
  .learn { grid-template-columns: minmax(0, 1fr); }
  .ol-resize { display: none; }
  .outline { display: none; position: fixed; inset: calc(var(--head) + env(safe-area-inset-top, 0px)) 0 0 0; height: auto; z-index: 25; background: var(--paper); border-right: 0; padding-right: var(--gutter-r); }
  .outline.open { display: block; }
  .main { padding-left: var(--gutter-l); }
  .toc-btn { display: inline-flex; }
}
.progress { height: 3px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

.unit-head { padding-block: 26px 18px; display: grid; gap: 8px; }
.unit-head .label { color: var(--accent-text); }
.unit-head h1 { font: 500 clamp(22px, 2.6vw, 32px)/1.15 var(--mono); text-transform: uppercase; letter-spacing: -.005em; }
.unit-head .sub { font: 400 14px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.tabs button { padding: 10px 2px; margin-right: 26px; font: 500 12px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.content { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 1180px) { .content { grid-template-columns: minmax(0, 1fr); } }
.media { display: grid; gap: 14px; }
.media figure { margin: 0; display: grid; gap: 8px; }
.media .gruppe { display: grid; gap: 8px; }
.media .gruppe + .gruppe { margin-top: 18px; }
.media .frame { border: 1px solid var(--line); background: #fff; cursor: zoom-in; display: block; padding: 0; width: 100%; }
.media .frame img { display: block; width: 100%; height: auto; }
.media .strip { border: 1px solid var(--line); background: #1d1d1d; overflow-x: auto; }
.media .strip img { display: block; max-width: none; height: 34px; }
.media .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
/* Videos (OLP): Vorschaubild von der eigenen Seite, der Player des Anbieters erst nach Zustimmung */
.media .video { margin: 0; display: grid; gap: 8px; }
.video .v-box { position: relative; aspect-ratio: 16 / 9; background: #111; border: 1px solid var(--line); overflow: hidden; }
.video iframe, .video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video .v-start { position: absolute; inset: 0; width: 100%; padding: 0; border: 0; background: #111; color: #fff; font: inherit; text-align: left; cursor: pointer; }
.video .v-start img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: .82; }
.video .v-play { position: absolute; left: 50%; top: 42%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.video .v-start:hover .v-play, .video .v-start:focus-visible .v-play { transform: scale(1.08); }
.video .v-play svg { width: 24px; height: 24px; margin-left: 4px; }
.video .v-note { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; background: rgba(0, 0, 0, .74); font-size: 13px; line-height: 1.45; }
.video figcaption { font-size: 13px; color: var(--muted); }
.app-embed { margin: 0; display: grid; gap: 8px; }
.app-embed iframe { display: block; width: 100%; border: 1px solid var(--line); background: var(--paper); }
.app-embed figcaption { font-size: 13px; color: var(--muted); }
.site-foot button.v-revoke { padding: 0; border: 0; background: none; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }
figcaption { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.labels { font: 400 12px/1.5 var(--mono); color: var(--muted); }
.text { display: grid; gap: 24px; min-width: 0; overflow-wrap: anywhere; }   /* lange Adressen umbrechen (auch in Grid-Kästen) */
.why { border: 1.5px solid var(--ink); border-radius: 16px; padding: 18px 20px; display: grid; gap: 8px; }
.why .label { color: var(--accent-text); }
.why p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--ink); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.5; }
.steps li:first-child { border-top: 1.5px solid var(--ink); }
.steps .n { width: 28px; height: 28px; border: 1.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font: 500 12px/1 var(--mono); margin-top: -1px; }
.steps .n.b { border: 0; }
.steps .n.b::before { content: ""; width: 8px; height: 8px; background: var(--ink); }
.steps li.sub { grid-template-columns: 34px 18px minmax(0, 1fr); padding-top: 4px; border-top: 0; font-size: 15px; color: var(--ink-2); }
.steps li.sub::before { content: none; }   /* kein Pseudo-Element: es wäre ein zusätzliches Rasterelement und schöbe den Text in die 34-px-Spalte */
.steps li.sub .n { display: none; }
.steps li.sub .s-mark { width: 10px; height: 1.5px; background: var(--inactive); margin-top: 11px; }
.steps li.h { display: block; padding: 18px 0 6px; border-bottom: 0; }
.steps li.h:first-child { border-top: 0; padding-top: 0; }
.steps li.h b { font: 500 12px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-text); }
.boxes { display: grid; gap: 22px; }
.boxes.b-text { display: none; }
@media (max-width: 1180px) { .boxes.b-media { display: none; } .boxes.b-text { display: grid; } }
code.cmd { font: 500 .9em/1 var(--mono); color: var(--accent-text); background: none; padding: 0 1px; border-bottom: 1px dashed transparent; cursor: copy; }
abbr[title] { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
code.cmd:hover { border-bottom-color: var(--accent-text); }
.hint { font-size: 15px; color: var(--ink-2); padding-left: 16px; border-left: 1.5px dashed var(--inactive); }
.foot { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-top: 36px; padding-top: 22px; border-top: 1.5px solid var(--ink); }
.foot .spacer { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.steps.has-ico li:not(.h):not(.sub) { grid-template-columns: 34px 30px minmax(0, 1fr); gap: 12px; }
.steps .ico { width: 30px; height: 30px; display: grid; place-items: center; margin-top: -2px; }
.steps .ico img { width: 26px; height: 26px; display: block; }
.steps .ico .ico-d { display: none; }
.probl { display: grid; gap: 14px; justify-items: start; padding-bottom: 36px; }
.probl ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; width: 100%; }
.probl li { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.probl li > span:nth-child(2), .probl li > span:first-child:not(.neu) { flex: 1; }
.probl p { margin: 0; color: var(--ink-2); }
.neu { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--on-accent); background: var(--accent); padding: 4px 7px; border-radius: 4px; }
.dl { display: grid; gap: 8px; }
.dl .label { color: var(--muted); }
.dl-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border: 1.5px solid var(--ink); text-decoration: none; color: var(--ink); }
.dl-item:hover { border-color: var(--accent-text); color: var(--accent-text); }
.dl-item svg { width: 18px; height: 18px; margin-top: 2px; }
.dl-item b { font-weight: 500; }
.dl-item .meta { display: block; margin-top: 2px; }
.orient { display: grid; gap: 14px; margin-top: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.orient .label { color: var(--muted); }
.orient figure { margin: 0; display: grid; gap: 6px; justify-items: start; }
.orient .frame.dark { background: #1e1e1e; border-color: #1e1e1e; width: auto; max-width: 100%; }
.orient .frame.dark img { width: auto; max-width: 100%; height: auto; max-height: 220px; }
.steps .wo { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 13px; line-height: 1.45; color: var(--muted); }
.steps .wo svg { width: 12px; height: 12px; flex: none; margin-top: 3px; }
.steps .wo b { font-weight: 500; color: var(--ink-2); }
.steps .wo .oder { font-style: italic; }
:root[data-theme="dark"] .steps .ico .ico-l { display: none; }
:root[data-theme="dark"] .steps .ico .ico-d { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .steps .ico .ico-l { display: none; }
  :root:not([data-theme="light"]) .steps .ico .ico-d { display: block; }
}
.done-panel { border: 1.5px solid var(--accent); padding: 28px; display: grid; gap: 14px; margin-top: 30px; }
.done-panel h2 { font: 500 26px/1.2 var(--sans); }
.done-panel p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); font: 500 12px/1 var(--mono); letter-spacing: .04em; padding: 12px 16px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.toast.show { opacity: 1; }
dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
dialog::backdrop { background: rgba(10, 10, 12, .82); }
dialog img { display: block; max-width: 96vw; max-height: 90vh; width: auto; height: auto; background: #fff; }
dialog button { position: absolute; right: 10px; top: 10px; background: var(--paper); color: var(--ink); padding: 8px 12px; font: 500 12px/1 var(--mono); }
.mock-note { color: var(--muted); padding-bottom: 28px; }
[hidden] { display: none !important; }
/* Kontrolle und „Klappt nicht?“ */
.kontrolle { border: 1.5px solid var(--accent-text); border-radius: 16px; padding: 14px 18px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 12px; }
.kontrolle svg { width: 18px; height: 18px; color: var(--accent-text); margin-top: 1px; grid-row: span 2; }
.kontrolle .label { color: var(--accent-text); }
.kontrolle p { margin: 0; font-size: 15.5px; line-height: 1.5; }
.antwort { margin-top: 8px; }
.antwort summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); padding: 4px 0; }
.antwort summary::-webkit-details-marker { display: none; }
.antwort summary::before { content: "+"; font: 500 15px/1 var(--mono); width: 12px; }
.antwort[open] summary::before { content: "−"; }
.antwort[open] summary { color: var(--muted); }
.antwort .auf, .antwort[open] .zu { display: none; }
.antwort[open] .auf { display: inline; }
.antwort p { margin: 6px 0 0; padding-left: 12px; border-left: 1.5px solid var(--accent-text); color: var(--ink-2); }
.loesung { border: 1.5px solid var(--marker, #f26a1b); padding: 0 16px; }
.loesung summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 0; font: 500 13px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--marker, #f26a1b); }
.loesung summary::-webkit-details-marker { display: none; }
.loesung summary::before { content: "+"; font: 500 16px/1 var(--mono); width: 14px; }
.loesung[open] summary::before { content: "−"; }
.loesung .auf, .loesung[open] .zu { display: none; }
.loesung[open] .auf { display: inline; }
.loesung[open] { padding-bottom: 16px; display: grid; gap: 14px; }
.loesung > .label { color: var(--muted); }
.loesung .steps .n { border-color: var(--marker, #f26a1b); color: var(--marker, #f26a1b); }
.klappt { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.klappt summary { list-style: none; cursor: pointer; padding: 12px 0; display: flex; align-items: center; gap: 10px; color: var(--ink-2); }
.klappt summary::-webkit-details-marker { display: none; }
.klappt summary::before { content: "+"; font: 500 16px/1 var(--mono); width: 14px; color: var(--muted); }
.klappt[open] summary::before { content: "−"; }
.klappt ul { margin: 0; padding: 0 0 14px 24px; list-style: none; display: grid; gap: 12px; }
.klappt li { display: grid; gap: 2px; font-size: 15px; line-height: 1.5; }
.klappt li b { font-weight: 500; }
.klappt li span { color: var(--ink-2); }
/* Problem melden */
.report { margin-top: 28px; }
.report > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; color: var(--muted); }
.report > summary::-webkit-details-marker { display: none; }
.report > summary:hover { color: var(--accent-text); }
.report > summary svg { width: 16px; height: 16px; }
.report form { margin-top: 16px; border: 1.5px solid var(--ink); border-radius: 16px; padding: 20px; display: grid; gap: 16px; max-width: 720px; }
.report form p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; border: 0; margin: 0; padding: 0; }
.chips legend { padding: 0; margin-bottom: 8px; }
.chips label { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.chips label:has(input:checked) { border-color: var(--accent-text); color: var(--accent-text); background: var(--accent-tint); }
.chips input { margin: 0; accent-color: var(--accent); }
.fld { display: grid; gap: 6px; }
.fld textarea, .fld input { font: 400 15px/1.45 var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--line); padding: 10px 12px; width: 100%; box-sizing: border-box; }
.fld textarea { min-height: 110px; resize: vertical; }
.fld textarea:focus, .fld input:focus { outline: 2px solid var(--accent-text); outline-offset: -1px; }
.row-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.report .status { font: 400 13px/1.4 var(--mono); color: var(--muted); }
.report .status.ok { color: var(--accent-text); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
.top .mlink { color: var(--muted); text-decoration: none; white-space: nowrap; }
.top .mlink:hover { color: var(--accent-text); }
.theme-btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); color: var(--ink-2); background: none; cursor: pointer; }
.theme-btn:hover { border-color: var(--accent-text); color: var(--accent-text); }
.theme-btn svg { width: 15px; height: 15px; }
/* Umschalter De/En, nur wenn das Bau-Skript DATA.lang setzt */
.theme-btn[hidden] { display: none; }
.lang-sw { text-decoration: none; white-space: nowrap; }
.lang-sw b { font-weight: 700; color: var(--accent-text); }
.lang-sw.aus { opacity: .5; cursor: not-allowed; }
.lang-sw.aus:hover { border-color: var(--line); color: var(--ink-2); }
@media (max-width: 560px) { .top-in:has(.lang-sw:not([hidden])) .infau { display: none; } .lang-sw { padding: 7px 6px; gap: 0; } }
@media (max-width: 560px) { .theme-btn .t-txt { display: none; } }
/* Handy: Der Pfad bekommt eine eigene zweite Zeile, sonst drücken Uni-Wortmarke, DE / EN und Hell/Dunkel ihn auf 0 px
   und es gibt keinen Rückweg zur Übersicht (Wunsch Nutzer 10.11.2026, Prüfung pruefe_handy.py).
   --head wächst nur, wenn der Pfad etwas enthält; Gliederung und Schrittleiste rechnen mit --head und rücken mit. */
@media (max-width: 560px) {
  :root:has(#crumbs:not(:empty)) { --head: 92px; }
  .top-in { flex-wrap: wrap; align-content: center; row-gap: 6px; }
  .brand:not(:has(.logo)) { display: none; }   /* nur noch das ausgeblendete Wort „Tutorials“: sonst kostet der leere Link Abstand und bricht bei 320 px die erste Zeile um */
  .crumbs { order: 9; flex: 1 0 100%; }
  .crumbs a, .crumbs span { flex: none; max-width: 60%; }
  .crumbs .cur { flex: 0 1 auto; min-width: 0; }
}
.notice { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45; width: min(440px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); border: 1.5px solid var(--accent-text); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); }
.notice .label { color: var(--accent-text); }
.notice p { margin: 0; font-size: 14.5px; line-height: 1.5; grid-column: 1; }
.notice p a { color: var(--accent-text); }
.notice button { grid-row: 1; grid-column: 2; align-self: start; background: none; border: 0; color: var(--muted); font: 500 18px/1 var(--mono); cursor: pointer; padding: 0 2px; }
.mel { display: grid; gap: 0; margin-top: 8px; }
.mel article { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.mel article:first-child { border-top: 1.5px solid var(--ink); }
.mel article.erledigt { opacity: .55; }
.mel h3 { margin: 0; font: 500 15px/1.4 var(--sans); }
.mel p { margin: 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
.mel .side { display: grid; gap: 8px; justify-items: end; align-content: start; }
@media (max-width: 640px) { .mel article { grid-template-columns: minmax(0, 1fr); } .mel .side { justify-items: start; } }
/* Apps: Karten mit zwei Zielen, Prompts zum Kopieren, Knöpfe im Text */
.programs.apps-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }   /* wie .programs: drei Kacheln nebeneinander, wenn Platz ist */
.app-card .prog-img { color: inherit; }
.app-card .prog-foot { gap: 10px; }
.app-card .prog-foot .meta { margin-right: auto; }
.text a:not(.btn):not(.dl-item) { color: var(--accent-text); }
.acts { display: flex; flex-wrap: wrap; gap: 12px; }
/* Bericht (KI Lernlabor, Hintergrundrecherche 17.11.2026): einspaltige Lesespalte statt Bild- und Textspalte, Units mit „bloecke“ */
.bericht { max-width: 76ch; display: grid; gap: 16px; min-width: 0; overflow-wrap: anywhere; }
.bericht p { margin: 0; font-size: 16.5px; line-height: 1.65; color: var(--ink); }
.bericht h3 { margin: 14px 0 0; font: 600 18px/1.3 var(--sans); }
.bericht ul, .bericht ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 16.5px; line-height: 1.6; }
.bericht .tab-wrap { overflow-x: auto; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
.bericht table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.45; overflow-wrap: normal; }
.bericht th, .bericht td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 9ch; }
.bericht th { font: 500 12px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.bericht tr:last-child td { border-bottom: 0; }
.bericht figure { margin: 8px 0; display: grid; gap: 8px; }
.bericht .frame { border: 1px solid var(--line); background: #fff; cursor: zoom-in; display: block; padding: 0; width: 100%; }
.bericht .frame img { display: block; width: 100%; height: auto; }
.bericht figcaption .quelle { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
.bericht .st { font: 500 11px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.prompts { display: grid; gap: 14px; }
.prompt { border: 1.5px solid var(--accent-text); background: var(--accent-tint); display: grid; min-width: 0; }
.prompt-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 6px 6px 16px; border-bottom: 1px solid var(--accent-text); }
.prompt-h .label { color: var(--accent-text); }
.prompt pre { margin: 0; padding: 14px 16px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font: 400 15.5px/1.55 var(--sans); color: var(--ink); }
.prompt pre mark { background: none; color: var(--accent-text); font-style: italic; }
.btn.sm { padding: 8px 10px; font-size: 12px; background: var(--paper); color: var(--accent-text); border-color: var(--accent-text); cursor: pointer; }
.apps-intro { display: grid; gap: 10px; max-width: 70ch; padding-bottom: 28px; color: var(--ink-2); }
.apps-intro p { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = {"mode": "apps", "programs": [], "soon": [], "apps": [{"id": "kremlas", "name": "KREMLAS · Dichte Packung", "kind": "Dokumentation", "standDoku": "25.11.2026", "standApp": "25.11.2026", "lead": "Woher das evolutionäre Verfahren kommt, wie wir es als Web-App weiterentwickelt haben, wie es Palladios Villen und Sizas Häuser nachgeneriert, und welche Verbesserungen wir getestet haben, mit allen Messwerten und Vergleichsbildern.", "autor": "Prof. Dr. Reinhard König in Zusammenarbeit mit Claude von Anthropic", "app": true, "open": "../", "covers": ["img/kremlas_fig_pal_malcontenta.webp", "img/kremlas_a_palladio.webp"], "topics": [{"id": "ueberblick", "title": "Auf einen Blick", "goal": "Kernaussagen der Dokumentation.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_fig_pal_malcontenta.webp", "units": [{"slide": 1, "title": "Auf einen Blick", "short": "Auf einen Blick", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "KREMLAS ist ein evolutionäres Verfahren, das Grundrisse aus einem Raumprogramm erzeugt: Räume fester Fläche, geforderte Nachbarschaften und ein Umriss gehen hinein, angeordnete Räume mit Wänden und Türen kommen heraus. Entstanden ist es im DFG-Projekt KREMLAS (2009–2011) an der Bauhaus-Universität Weimar, aufbauend auf einer Idee von Tomor Elezkurtaj und Georg Franck. Seit November 2026 läuft es als Web-App im KI Lab von entwurfsforschung.de und wurde dabei stark weiterentwickelt. Diese Dokumentation erzählt, woher das Verfahren kommt, was wir geändert haben, wie es die Grundrisse von Palladios Villen und von Álvaro Sizas Häusern in der Malagueira nachgeneriert und welche Verbesserungen wir getestet haben, mit allen Messwerten."}, {"t": "p", "md": "**Die Kernaussagen auf einen Blick:**"}, {"t": "ol", "items": ["**Herkunft.** Ausgangspunkt der ganzen Entwicklung ist die Arbeit von Elezkurtaj und Franck (2002). Im DFG-Projekt KREMLAS entstand daraus der Layoutsolver „Dichte Packung“: eine hybride Evolutionsstrategie mit Kollisionserkennung und virtuellen Federn, beschrieben im Buch von Donath, König und Petzold (2012).", "**Treue Neuumsetzung.** Die Web-App folgt dem C#-Programm Regel für Regel. Zwei Programmfehler aus dem Original haben wir gefunden und behoben: Die Hälfte der Federn zog in die falsche Richtung, und Räume, die sich berührten, bekamen gar keinen Zug.", "**Grundrisse, die funktionieren.** Mindestbreiten je Raum, eine Bewertung des fertigen Plans (Türen, Breiten, Flächen) und eine Suche über viele kurze Läufe machen aus der Packung brauchbare Grundrisse. Vorher war bei unseren Prüfregeln kein einziger Lauf gültig.", "**Vorbilder nachgenerieren.** KREMLAS bekommt von einem Vorbild nur das Raumprogramm, die Türen und den Umriss und sucht die Anordnung selbst. Gemessen wird die Überdeckung jedes Raums mit dem Vorbild, gespiegelte Pläne gelten als gleich.", "**Palladio fast vollständig, Siza zum größten Teil.** Sieben der acht Villen werden mit 99–100 % Ähnlichkeit wiedergefunden, Pisani mit 88 %. Die Erdgeschosse der Siza-Häuser gelingen einzeln meist vollständig, die Obergeschosse mit langen, verketteten Fluren deutlich seltener. Seit 25.11.2026 entstehen Erd- und Obergeschoss zusammen, mit Treppe und Hof übereinander; solche Häuser findet die Suche bisher selten.", "**Fehler finden lohnt mehr als Tricks.** Die größten Sprünge kamen aus behobenen Fehlern: falsche Federrichtung, eine zu strenge Türregel für Siza, ein falscher Feldrahmen in der Überlappungsbewertung. Von zwölf Vorschlägen aus der Literatur brachte keiner im Mittel über alle Vorbilder einen messbaren Gewinn.", "**Die Startsaat entscheidet viel.** Dieselbe Villa wird mit einer Suchreihe vollständig, mit einer anderen gar nicht gefunden. Verlässliche Aussagen brauchen deshalb Messungen über mehrere Suchreihen; seit 25.11.2026 gelten Voreinstellungen nur, wenn sie an zwei getrennten Saatgruppen gewinnen."]}]}], "bericht": true}, {"id": "k1", "title": "Herkunft", "goal": "Elezkurtaj und Franck, das DFG-Projekt KREMLAS und das Originalprogramm.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_fig_verfahren.webp", "units": [{"slide": 1, "title": "Ausgangspunkt: Elezkurtaj und Franck", "short": "Ausgangspunkt: Elezkurtaj und Franck", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Die Idee, Grundrisse durch dichtes Packen von Räumen zu erzeugen, geht auf Tomor Elezkurtaj und Georg Franck zurück: [Algorithmic Support of Creative Architectural Design](https://www.researchgate.net/publication/255606960_Algorithmic_Support_of_Creative_Architectural_Design), erschienen in *Umbau* 19 (2002), S. 129–137. Sie unterscheiden konkret definierbare, „handfeste“ Fragen eines Entwurfs, die sich einem Algorithmus übergeben lassen, von unscharfen, kontextabhängigen Fragen, die beim Menschen bleiben. Das Packen von Räumen fester Fläche unter Nachbarschaftsbedingungen ist eine solche handfeste Frage. Der Computer schlägt Anordnungen vor, die Entwerferin wählt und greift ein."}]}, {"slide": 2, "title": "Das DFG-Projekt KREMLAS", "short": "Das DFG-Projekt KREMLAS", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Im DFG-Projekt KREMLAS (2009–2011) wurden an der Bauhaus-Universität Weimar kreative evolutionäre Entwurfsmethoden für Layoutprobleme in Architektur und Städtebau untersucht. Die Ergebnisse stehen im Buch, herausgegeben von Dirk Donath, Reinhard König und Frank Petzold: *KREMLAS. Entwicklung einer kreativen evolutionären Entwurfsmethode für Layoutprobleme in Architektur und Städtebau* (Verlag der Bauhaus-Universität Weimar 2012). Kapitel 5 beschreibt die dichte Packung, Kapitel 9 den Grundriss-Generator mit den Raumprogrammen nach Flemming, Kapitel 12 die Türen. Zwei Videos aus dem Projekt zeigen das Verfahren in Bewegung: [Computational Floorplan Synthesis](https://vimeo.com/42206895) und [Packing mit Sichtfeldbewertung](https://vimeo.com/24671938)."}, {"t": "p", "md": "Neben der dichten Packung entstanden im Projekt Unterteilungsverfahren mit K-d- und Slicing-Bäumen. Katja Knecht und Reinhard König haben beide Ansätze später verglichen: [Comparing two evolutionary algorithm based methods for layout generation: dense packing versus subdivision](https://doi.org/10.1017/S0890060414000237) (AI EDAM 2014)."}]}, {"slide": 3, "title": "Das Originalprogramm", "short": "Das Originalprogramm", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Das Programm „Einpassung“ ist in C# geschrieben (Windows Forms, Reinhard König, Computational Planning Group). Es liegt im öffentlichen Repository [cpg_all](https://bitbucket.org/koenigr/cpg_all) im Ordner `Source/Kremlas/`: die Evolutionsstrategie in `REvo`, das Individuum in `RChromosome`, die Federn in `RSpring`, die Kollisionserkennung in `Collision`. Die Klassen tragen Stände von 2010 und Februar 2011. Viele Teile des Buchs sind im Code vorbereitet, aber nicht aufgerufen: die Topologie-Läufe, die Raumprogramme, die Türen. Die Neuumsetzung hat sie wieder zusammengeführt."}]}], "bericht": true}, {"id": "k2", "title": "Das Verfahren", "goal": "Räume als Rechtecke, hybride Evolutionsstrategie, Federn.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_fig_verfahren.webp", "units": [{"slide": 1, "title": "Räume als Rechtecke", "short": "Räume als Rechtecke", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Ein Individuum ist ein Grundriss aus n Rechtecken in einem Umgebungsrechteck, im Original 500 × 430 Pixel. Jedes Rechteck ist ein Raum mit fester Fläche. Frei sind seine Lage und sein Seitenverhältnis, mit einer Untergrenze für die kürzeste Seite. Gesucht ist eine Anordnung, in der sich die Räume nicht überlappen. Zu minimieren ist die Überlappung **Sg**: die Summe aller Schnittflächen der Räume plus der Flächen außerhalb des Umgebungsrechtecks."}]}, {"slide": 2, "title": "Hybride Evolutionsstrategie", "short": "Hybride Evolutionsstrategie", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Eine Evolutionsstrategie verbindet zwei Verfahren. Kinder entstehen durch Rekombination zweier Eltern (ein Abschnitt der Genliste wird getauscht, die Raumnummern bleiben erhalten) und durch Mutation: zufällige Verschiebung einzelner Räume, selten mit großen Sprüngen, Änderung der Proportion, Inversion der Genreihenfolge. Danach „entwickelt“ sich jedes Kind durch Kollisionserkennung. Überlappen sich zwei Räume, weichen beide um einen Teil des kürzesten Trennvektors aus (Abstoßen, Kraft β) und ändern ihre Proportion so, dass die Fläche bleibt (Kraft α). Die Kollision prüft das Separating Axis Theorem, im Original nach Laurent Cozic, hier für achsparallele Rechtecke eigenständig formuliert. Bei der (μ+λ)-Selektion konkurrieren Eltern und Kinder, bei (μ,λ) nur die Kinder."}]}, {"slide": 3, "title": "Federn für Nachbarschaften", "short": "Federn für Nachbarschaften", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Sollen zwei Räume benachbart sein, zieht eine virtuelle Feder sie zusammen. Ein zweites Kriterium **f2** summiert die Abstände geforderter Nachbarn samt fehlender Durchgangsbreite. Die Selektion wählt einen Teil der Eltern nach Sg, den anderen nach f2. Sobald die beste Lösung nach Sg auch f2 unter 1,5 · Räume erreicht, verschiebt sich die Aufteilung (Regeln 20 und 21 des Buchs, Schwellen aus dem Code). Das Original kennt zwei Topologien: alle Räume an einem zentralen Raum (Stern) und ein Gang mit drei Wohnungen zu je fünf Räumen."}, {"t": "fig", "src": "img/kremlas_fig_verfahren.webp", "w": 1700, "h": 631, "nr": 1, "cap": "Ablauf des Verfahrens. Schwarz umrandet die Schritte des Originals, blau die Ergänzungen der Neuumsetzung 2026.", "quelle": "eigene Darstellung"}]}], "bericht": true}, {"id": "k3", "title": "Neuumsetzung als Web-App", "goal": "Treue Neuumsetzung, zwei Programmfehler, Grundriss-Generator.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_a_packung.webp", "units": [{"slide": 1, "title": "Treu zum Original", "short": "Treu zum Original", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Die Web-App entstand im November 2026 im Rahmen der Frühen Simulationen, der Neuumsetzung der Programme der alten Website. Modell und Oberfläche sind getrennt: `modell.js` enthält die reine Logik ohne Bildschirm und lässt sich in Node prüfen, `app.js` die Bedienung im gemeinsamen Rahmen der Frühen Simulationen. Gerechnet wird mit fester Saat, gleiche Saat ergibt denselben Lauf. Das Original legte den Zufall bei jedem Raum mit der Uhrzeit neu an und hatte dadurch höchstens 1000 verschiedene Startindividuen. Die Fassungen *Einpassung* (Stand des Programms), *Kollision allein*, *Topologie: Stern* und *Topologie: Gang* bilden die Abläufe des Codes nach, jede Abweichung steht in `QUELLE.md`."}]}, {"slide": 2, "title": "Zwei Programmfehler und die Federrunden", "short": "Zwei Programmfehler und die Federrunden", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Beim Prüfen fiel auf, dass sich die Räume kaum der Topologie entsprechend anzogen. Die Ursache waren zwei Fehler im Original. Erstens war der Zuschlag für fehlende Durchgangsbreite in `RSpring.AdditionalVector` immer positiv. Er schob einen Raum stets nach rechts unten, gleich wo der Nachbar lag, und zog so bei rund der Hälfte der Federn in die falsche Richtung. Zweitens prüfen `CalcSpringVector` und `AdditionalVector` nur echte Abstände. Liegen zwei Räume genau aneinander oder überlappen sie hauchdünn, der Normalfall nach jeder Kollisionsrunde, fällt der Fall durch alle Abfragen: Die Feder ist tot, obwohl die gemeinsame Wand für einen Durchgang zu kurz ist. Bei Saat 1 war das bei 20 von 96 offenen Nachbarschaften so."}, {"t": "p", "md": "Nach beiden Korrekturen kam ein neuer Regler dazu: Federn und Kollisionserkennung wechseln je Kind mehrmals ab (*Federrunden*, im Original zwei). Erst dann ziehen sich die Räume sichtbar zusammen."}, {"t": "table", "kopf": ["Fassung (16 Saaten)", "vorher ganz gelöst", "nachher ganz gelöst"], "zeilen": [["Stern, 8 Räume, nach 100 Generationen", "4", "12"], ["Stern, 8 Räume, nach 2000 Generationen", "10", "16"], ["Gang, 16 Räume, nach 1000 Generationen", "3", "12"]]}]}, {"slide": 3, "title": "Der Grundriss-Generator", "short": "Der Grundriss-Generator", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Die Fassungen *Grundriss* machen aus der Packung einen Grundriss-Generator, wie ihn das Buch beschreibt. Grundlage sind die Raumprogramme mit acht und zehn Räumen nach Flemming (Flur, Hof, Wohnen, Elternschlafzimmer, Zimmer, Küche, Bad, zusammen 86 m²), im Code in `REvo.GrowPolys` vorbereitet. Dazu kam ein angenommenes Programm mit sechs Räumen, die heutige Voreinstellung. Maßstab 50 Pixel = 1 m, Feld 10 × 8,6 m. Aus der besten Packung wird ein Plan abgeleitet: Jeder Raum wächst in die Restflächen, bis er auf einen anderen oder auf die Außenwand stößt. An gemeinsamen Wänden geforderter Nachbarn sitzt mittig eine Tür, wie im Buch. Voreingestellt ist eine angenommene Wohnung mit Eingang am Flur, die Sterntopologie des Buchs ist wählbar."}]}], "bericht": true}, {"id": "k4", "title": "Grundrisse, die funktionieren", "goal": "Mindestmaße, Bewertung des Plans, Suche, L-Räume.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_a_loesungen.webp", "units": [{"slide": 1, "title": "Was als gültig zählt", "short": "Was als gültig zählt", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Ein Plan zählt als gültig, wenn jede geforderte Nachbarschaft eine Tür hat, sich keine Räume überlappen und jeder Raum seine Mindestbreite und mindestens 95 % seiner Fläche erreicht. Mit dem Stand des Buchs war nach diesen Regeln kein Lauf gültig: Die kürzeste Seite durfte bis auf 0,4 · √Fläche sinken, das Wohnzimmer wurde dann 1,3 m breit. Eine geltende Norm mit Mindestbreiten je Raumart gibt es nicht. Für den Flur gilt DIN 18040-2 (barrierefreie Wohnungen, 1,20 m), die übrigen Werte sind ausgewiesene Annahmen nach üblichen Möblierungen: Wohnen 3,00 m, Eltern 2,80 m, Zimmer und Essen 2,40 m, Küche 1,80 m, Bad 1,60 m."}]}, {"slide": 2, "title": "Bewerten, was am Ende geprüft wird", "short": "Bewerten, was am Ende geprüft wird", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Mindestbreiten allein halfen nicht, die steifen Räume verhakten sich. Den Ausschlag gab eine dritte Bewertung **f3**, die den abgeleiteten Plan selbst bewertet: fehlende Türen, zu schmale und zu kleine Räume, Überlappung. Wichtig war, Türen gleitend zu messen, als Abstand der Räume plus fehlende Länge der gemeinsamen Wand. So sieht die Selektion auch kleine Fortschritte. In der Selektion ersetzt f3 das Kriterium f2. Kleine Überlappungen bis 0,5 m teilt der Plan, die Wand rückt in ihre Mitte, und damit dabei jeder Raum seine Fläche behält, belegen die Räume 96 % des Feldes."}]}, {"slide": 3, "title": "Viele kurze Läufe", "short": "Viele kurze Läufe", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Treffer kamen in den Messungen fast immer früh oder gar nicht. Die Suche startet deshalb viele kurze Läufe mit neuen Saaten statt eines langen. Ein Lauf endet beim ersten gültigen Plan. Sonst wird am Ende nachgebessert: Einzelne Räume werden ein wenig verschoben oder in der Proportion geändert, und behalten wird, was f3 nicht verschlechtert (eine örtliche Suche, memetisch). Unter den Treffern wählt die Suche möglichst verschiedene aus (Maximin). Mit sechs Räumen sind drei Grundrisse meist in ein bis zwei Sekunden gefunden, mit acht Räumen in rund 20 Sekunden."}]}, {"slide": 4, "title": "L-förmige Räume", "short": "L-förmige Räume", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Je Raum lässt sich erlauben, dass er L-förmig wird. Er besteht dann aus zwei Rechtecken, Hauptteil und Schenkel, die eine innere Feder zusammenhält. Gültig ist ein L, wenn sich beide Teile auf mindestens der Mindestbreite berühren und an einem Ende bündig liegen, sonst entstünde ein T oder ein Z. Mit sechs Räumen und L-förmigem Flur und Wohnen findet die Suche drei Grundrisse in wenigen Sekunden, mit acht Räumen werden L-Räume deutlich seltener gültig."}]}], "bericht": true}, {"id": "rundgang", "title": "Rundgang durch die App", "goal": "Die drei Tabs der App bedienen: Dichte Packung, Palladio-Villen, Siza/Duarte.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_a_palladio.webp", "bericht": false, "units": [{"slide": 1, "title": "Dichte Packung", "short": "Dichte Packung", "subtitle": "Ein Grundriss aus sechs Räumen", "notes": "Die App startet mit dem Grundriss aus sechs Räumen: Flur, Wohnen, Küche, Elternschlafzimmer, Zimmer und Bad, angenommene Wohnung mit Eingang am Flur. Links die beste Lösung der aktuellen Generation als Plan mit Wänden und Türen, rechts daneben der Verlauf von Sg und f2, ganz rechts das Bedienfeld.", "orient": [], "orientLabel": "", "labels": [], "images": [{"src": "img/kremlas_a_packung.webp", "w": 1700, "h": 2427, "strip": false}], "captions": ["Grundriss mit sechs Räumen nach 400 Generationen (Saat 2), helle Darstellung."], "hints": [], "downloads": [], "actions": [{"label": "App öffnen", "href": "../"}], "prompts": [], "promptsFirst": false, "steps": [{"n": 1, "md": "Öffne die App und drücke **Start**. Die Räume ordnen sich, ein Schritt ist eine Generation."}, {"n": 2, "md": "Drücke **Pause** und ziehe einen Raum mit der Maus an eine andere Stelle. Die übrigen weichen aus."}, {"n": 3, "md": "Wähle unter **Fassung** die Topologie Stern oder Gang, um das Verfahren des Originals ohne Raumprogramm zu sehen."}], "boxes": [], "kontrolle": "Du kannst erklären, warum die Räume in der Fassung „Einpassung“ keine Nachbarschaften bilden: Dort gibt es keine Federn.", "fehler": [], "bloecke": []}, {"slide": 2, "title": "Regler", "short": "Regler", "subtitle": "Fassung, Mindestmaße, L-Räume, Evolutionsstrategie", "notes": "Das Bedienfeld folgt dem Original: Evolutionsstrategie (μ, Druck, (μ+λ), Rekombination), Kollisionserkennung (Kräfte und Raten für Abstoßen und Proportion) und Topologie (Federdämpfung, Durchgangsbreite, Federrunden). Neu sind unter **Fassung** die Nachbarschaften im Grundriss, der Schalter **Mindestmaße** und der Kasten **L-förmige Räume**.", "orient": [], "orientLabel": "", "labels": [], "images": [{"src": "img/kremlas_a_regler.webp", "w": 540, "h": 3083, "strip": false}], "captions": ["Bedienfeld mit Fassung, Mindestmaßen, L-förmigen Räumen und den Reglern der Evolutionsstrategie."], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [{"n": 1, "md": "Schalte **Mindestmaße** aus: Es gilt der Stand des Buchs mit 100 % Belegung, und die Räume dürfen schmal werden."}, {"n": 2, "md": "Erhöhe die **Federrunden** von 2 auf 10 und beobachte, wie viel schneller sich die Nachbarn finden."}, {"n": null, "md": "Regler mit ↺ setzen den Lauf zurück, die übrigen wirken ab der nächsten Generation."}], "boxes": [], "kontrolle": "Du weißt, welche Regler aus dem Original stammen und welche neu sind.", "fehler": [], "bloecke": []}, {"slide": 3, "title": "Lösungen suchen", "short": "Lösungen suchen", "subtitle": "Grundrisse mit Türen und Mindestmaßen", "notes": "Unter der Grafik sucht **Grundrisse suchen** die eingestellte Zahl gültiger Grundrisse: alle Türen, keine Überlappung, Mindestbreiten und Flächen. Die Suche startet viele kurze Läufe mit neuen Saaten, bessert Beinahe-Lösungen nach und wählt möglichst verschiedene Treffer. Ein Klick auf eine Karte lädt den Grundriss in die Ansicht.", "orient": [], "orientLabel": "", "labels": [], "images": [{"src": "img/kremlas_a_loesungen.webp", "w": 1700, "h": 608, "strip": false}], "captions": ["Drei gefundene Grundrisse als Karten, mit Saat, Generation und Türen."], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [{"n": 1, "md": "Stelle die **Anzahl** ein und drücke **Grundrisse suchen**."}, {"n": 2, "md": "Klicke eine Karte an. Der Grundriss erscheint oben und lässt sich weiterrechnen oder mit der Maus bearbeiten."}, {"n": 3, "md": "Wähle den Grundriss mit 8 oder 10 Räumen und vergleiche die Suchzeiten."}], "boxes": [], "kontrolle": "Du hast drei verschiedene gültige Grundrisse gefunden und einen davon weiterbearbeitet.", "fehler": [], "bloecke": []}, {"slide": 4, "title": "L-förmige Räume", "short": "L-förmige Räume", "subtitle": "Ein Raum aus zwei Rechtecken", "notes": "Im Kasten **L-förmige Räume** wählst du, welche Räume L-förmig werden dürfen. Ausgegraut sind Räume, deren Fläche für zwei Schenkel mit Mindestbreite nicht reicht. Ein L besteht aus Hauptteil und Schenkel, die bündig an einer Ecke liegen müssen.", "orient": [], "orientLabel": "", "labels": [], "images": [{"src": "img/kremlas_a_lwahl.webp", "w": 491, "h": 213, "strip": false}, {"src": "img/kremlas_a_lform.webp", "w": 1572, "h": 990, "strip": false}], "captions": ["Kasten L-förmige Räume: Flur und Wohnen dürfen L-förmig werden.", "Gefundener Grundriss mit L-förmigem Flur und Wohnen."], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [{"n": 1, "md": "Kreuze **Flur** und **Wohnen** an."}, {"n": 2, "md": "Suche drei Grundrisse und lade einen davon."}, {"n": null, "md": "L-Räume machen die Suche mit acht Räumen deutlich langsamer."}], "boxes": [], "kontrolle": "Du siehst im Plan, dass zwischen Hauptteil und Schenkel keine Wand steht.", "fehler": [], "bloecke": []}, {"slide": 5, "title": "Palladio-Villen", "short": "Palladio-Villen", "subtitle": "Rekonstruieren und Varianten", "notes": "Im Tab **Palladio-Villen** wählst du eine der acht Villen. Die Einstellungen sind je Villa abgestimmt. Mit **Nähe zum Vorbild** 1 rekonstruiert KREMLAS die Villa, mit 0 entstehen freie Varianten. Unter dem erzeugten Grundriss steht das Vorbild im gleichen Maßstab, so gespiegelt, wie es am besten passt, mit der Ähnlichkeit in der Bildunterschrift.", "orient": [], "orientLabel": "", "labels": [], "images": [{"src": "img/kremlas_a_palladio.webp", "w": 1620, "h": 3030, "strip": false}, {"src": "img/kremlas_a_palladio_varianten.webp", "w": 1700, "h": 663, "strip": false}], "captions": ["Villa Emo nach 400 Generationen, darunter das Vorbild im gleichen Maßstab.", "Drei freie Varianten der Villa Emo (Nähe zum Vorbild 0) mit ihrer Ähnlichkeit."], "hints": [], "downloads": [], "actions": [{"label": "Palladio-Villen öffnen", "href": "../palladio/"}], "prompts": [], "promptsFirst": false, "steps": [{"n": 1, "md": "Wähle unter **Villa (Vorbild)** die Villa Pisani und suche einen Grundriss."}, {"n": 2, "md": "Schalte **Starre Raumform** aus und suche erneut. Was passiert mit dem I-förmigen Saal?"}, {"n": 3, "md": "Stelle **Nähe zum Vorbild** auf 0 und suche Varianten."}], "boxes": [], "kontrolle": "Du kannst erklären, warum die Varianten bei Palladio dem Vorbild trotzdem stark ähneln: Das symmetrische Raster lässt nur wenige Anordnungen zu.", "fehler": [], "bloecke": []}, {"slide": 6, "title": "Siza/Duarte", "short": "Siza/Duarte", "subtitle": "Haus aus Erd- und Obergeschoss", "notes": "Im Tab **Siza/Duarte** wählst du eines von sechs Häusern. Erd- und Obergeschoss entstehen zusammen und stehen nebeneinander: Die Treppe liegt in beiden Geschossen an derselben Stelle, der Luftraum im Obergeschoss genau über dem Hof. Die Treppe ist mit Stufen und Lauflinie gezeichnet, Punkt am Antritt, Pfeil am Austritt; davor muss ein Podest frei bleiben.", "orient": [], "orientLabel": "", "labels": [], "images": [{"src": "img/kremlas_a_siza.webp", "w": 1620, "h": 3180, "strip": false}], "captions": ["Typ Bb nach 300 Generationen: links das Erdgeschoss, rechts das Obergeschoss mit derselben Treppe und dem Luftraum über dem Hof."], "hints": [], "downloads": [], "actions": [{"label": "Siza/Duarte öffnen", "href": "../siza/"}], "prompts": [], "promptsFirst": false, "steps": [{"n": 1, "md": "Wähle **Typ Bb (Hof hinten)**, starte die Evolution und beobachte, wie das Obergeschoss Treppe und Hof aus dem Erdgeschoss übernimmt."}, {"n": 2, "md": "Suche Häuser. Die Statuszeile zeigt, ob gerade das Erdgeschoss oder ein Obergeschoss gesucht wird."}, {"n": 3, "md": "Schau dir in der Kennzahl **Treppe: Antritt · Austritt** an, ob die Podeste frei sind."}], "boxes": [], "kontrolle": "Du kannst erklären, warum ein Haus aus zwei Geschossen schwerer zu finden ist als jedes Geschoss für sich.", "fehler": [], "bloecke": []}]}, {"id": "k5", "title": "Vorbilder nachgenerieren: das Vorgehen", "goal": "Vom Vorbild zum Raumprogramm, neue Bausteine, Ähnlichkeit, Abstimmung.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_a_palladio.webp", "units": [{"slide": 1, "title": "Die Frage", "short": "Die Frage", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Kann die evolutionäre Methode von KREMLAS bekannte Grundrisse wiederfinden? Vorbilder sind die acht Villen der Konzeptstudie Palladio (Grammatik nach Stiny und Mitchell 1978, Raumaufteilungen nach Stiny und Gips 1978) und sechs Häuser der Konzeptstudie Duarte/Siza (eigene Rekonstruktion der Malagueira-Grammatik von Duarte 2005), je Erd- und Obergeschoss. KREMLAS bekommt vom Vorbild nur, was ein Raumprogramm enthält: Umriss, Räume mit Flächen und Formen, Türen als geforderte Nachbarschaften, bei Palladio die Spiegelachse, bei Siza die Lage von Treppe und Luftraum im Obergeschoss. Wo die übrigen Räume liegen, muss die dichte Packung selbst finden."}]}, {"slide": 2, "title": "Vom Vorbild zum Raumprogramm", "short": "Vom Vorbild zum Raumprogramm", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Zwei kleine Werkzeuge übersetzen die Vorbilder, `vorbilder_palladio.cjs` und `vorbilder_siza.cjs`. Bei Palladio ist ein Raum die Fläche seiner Rasterzellen samt der Wände dazwischen, nach außen um eine halbe Wandstärke erweitert. So füllen die Räume das Innere lückenlos. Maße in Meter, ein Vicentiner Fuß zu 0,357 m. Zusammengesetzte Säle (Kreuz, T, I) werden zeilenweise in Rechtecke zerlegt, Loggien sind nach außen offen und dienen als Eingang. Bei Siza füllen die Räume das Grundstück von 8 × 12 m, die Höfe zählen als Räume, und Räume gleicher Funktion, die sich berühren, bilden einen Raum aus Teilen. Die Türbreite ist bei Siza 0,80 m wie in der Grammatik. Die Mindestbreite eines Raums ist 0,8 · seine kürzeste Seite im Vorbild, als Spielraum für Varianten. Vor jeder Messung prüfen wir, ob das Vorbild selbst unsere Regeln besteht. Sonst könnte die Rekonstruktion es nie als gültig finden."}]}, {"slide": 3, "title": "Neue Bausteine im Verfahren", "short": "Neue Bausteine im Verfahren", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "ul", "items": ["**Feld je Programm:** Umriss und Maßstab je Vorbild statt fest 500 × 430 Pixel.", "**Spiegelsymmetrie** (Palladio): Räume auf der Achse bleiben mittig, die übrigen bilden Paare, die nach jeder Entwicklung auf ihre gemittelte, gespiegelte Lage gebracht werden.", "**Raumtausch:** Zwei Räume ähnlicher Fläche tauschen ihre Plätze, Spiegelpaare immer beidseitig. Sonst bliebe die einmal gefundene Reihenfolge der Räume fast fest.", "**Starre Raumform:** Ein zusammengesetzter Saal behält Form und Maße des Vorbilds, frei ist nur seine Lage.", "**Feste Räume** (Siza): Treppe und Luftraum stehen an der Stelle des Vorbilds.", "**Nähe zum Vorbild:** ein Regler von 0 (freie Varianten mit demselben Programm) bis 1 (Rekonstruktion). Er nimmt die Abweichung vom Vorbild in f3 auf. Bei Nähe > 0 läuft jeder Lauf bis zum Ende, und der gültige Plan, der dem Vorbild am nächsten kommt, wird zum Schluss noch nachgebessert."]}]}, {"slide": 4, "title": "Ähnlichkeit messen", "short": "Ähnlichkeit messen", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Je Raum zählt die Überdeckung seiner Fläche im Plan mit der Fläche im Vorbild, als Schnitt durch Vereinigung, gemittelt über alle Räume. 100 % heißt deckungsgleich. Gespiegelte Grundrisse gelten als gleich: Verglichen wird mit dem Plan selbst und seinen Spiegelungen links/rechts, vorn/hinten und beiden, und es zählt die beste Lage. In der App steht das Vorbild unter dem erzeugten Grundriss im gleichen Maßstab und so gespiegelt, wie es am besten passt."}]}, {"slide": 5, "title": "Abstimmung je Vorbild", "short": "Abstimmung je Vorbild", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Welche Einstellungen am besten sind, hängt vom Vorbild ab. Für jedes Vorbild wurden 18 Einstellungen gemessen: starre Raumform an oder aus, zwei, fünf oder zehn Federrunden und eine Belegung von 94, 96 oder 98 %, je höchstens acht Läufe zu 400 Generationen. Die beste ist bei der Wahl des Vorbilds voreingestellt (`werkzeuge/abstimmen.cjs`, Ergebnis `werkzeuge/abstimmung.json`). Weil die Abstimmung auf einer Suchreihe beruht, sind die dort gemessenen Werte etwas optimistisch. Die Tabellen in den nächsten beiden Kapiteln mitteln deshalb über vier Suchreihen."}, {"t": "p", "md": "Am 25.11.2026 haben wir die Voreinstellungen nachgeprüft: starre Raumform an oder aus, Raumgruppe spiegeln und Wände verschieben, je vier Suchreihen, und jede Änderung zusätzlich an vier frischen Saaten. Übernommen wurde nur, was an beiden Saatgruppen gewinnt. Dabei zeigte sich, dass die Wahl der starren Raumform je Vorbild vorher vom Zufall der einen Suchreihe abhing (Einzelheiten im Kapitel „Versuche zur Verbesserung“)."}]}], "bericht": true}, {"id": "k6", "title": "Ergebnisse: Palladios Villen", "goal": "Acht Villen mit Messwerten und Vergleichsbildern.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_fig_pal_pisani.webp", "units": [{"slide": 1, "title": "Messwerte", "short": "Messwerte", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Je Villa vier Suchreihen mit den Startsaaten 1, 51, 101 und 151, je höchstens sechs Läufe zu 400 Generationen, abgestimmte Voreinstellungen. **Beste** ist die beste Ähnlichkeit über alle Reihen, **Mittel** der Durchschnitt der besten Ähnlichkeit je Reihe (eine Reihe ohne gültigen Plan zählt 0), **Reihen** die Zahl der Reihen mit gültigem Plan. Bei Nähe 0 sucht KREMLAS freie Varianten mit demselben Programm, und die Ähnlichkeit zeigt nur, wie weit sie vom Vorbild abweichen."}, {"t": "table", "kopf": ["Vorbild", "Rekonstruktion: beste", "Mittel", "Reihen", "Variante: beste", "Mittel", "Reihen"], "zeilen": [["Villa Foscari (Malcontenta)", "99 %", "25 %", "1/4", "96 %", "47 %", "2/4"], ["Villa Saraceno", "100 %", "91 %", "4/4", "91 %", "82 %", "4/4"], ["Villa Ragona", "100 %", "100 %", "4/4", "98 %", "95 %", "4/4"], ["Villa Zeno", "100 %", "100 %", "4/4", "96 %", "94 %", "4/4"], ["Villa Badoer · Villa Poiana", "100 %", "100 %", "4/4", "87 %", "84 %", "4/4"], ["Villa Emo", "100 %", "100 %", "4/4", "88 %", "78 %", "4/4"], ["Villa Pisani", "88 %", "86 %", "4/4", "88 %", "84 %", "4/4"], ["Villa Angarano", "100 %", "100 %", "4/4", "92 %", "88 %", "4/4"]]}]}, {"slide": 2, "title": "Vergleich: Vorbild, Rekonstruktion, Variante", "short": "Vergleich: Vorbild, Rekonstruktion, Variante", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Je Villa links das Vorbild, in der Mitte die ähnlichste Rekonstruktion (Nähe 1), rechts die ähnlichste freie Variante (Nähe 0), alle im gleichen Maßstab und in der Lage des Vorbilds. Grün: Räume, deren Überdeckung mit dem Vorbild mindestens 90 % beträgt, sonst hell. Die Prozentzahlen sind die Ähnlichkeiten."}, {"t": "fig", "src": "img/kremlas_fig_pal_malcontenta.webp", "w": 1700, "h": 520, "nr": 2, "cap": "Villa Foscari (Malcontenta): links das Vorbild, Mitte die Rekonstruktion (99 %), recht ng.", "quelle": "eigene Darstellung"}]}, {"slide": 3, "title": "Warum Saraceno und Pisani schwer sind", "short": "Warum Saraceno und Pisani schwer sind", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Beide Vorbilder bestehen die eigenen Regeln. Schwer ist der Weg dorthin. Pisanis Saal ist ein I aus drei Rechtecken, das zwei Stanzen in seinen Einbuchtungen umschließt. Hängen die Teile nur an Federn, landen die Querbalken oft auf derselben Seite, oder sie können sich nicht um die Stanzen schließen, denn Kollision und Federn wirken nur paarweise. Erst die starre Raumform hält das I zusammen, von 48 auf 88 %. Saraceno hat extrem ungleiche Räume, 14 bis 186 m², und einen T-Saal. Vor der Korrektur des Feldrahmens (siehe „Fehler und Korrekturen“) fand die Suche mit der ersten Voreinstellung keinen gültigen Plan, seither bis 100 %."}]}], "bericht": true}, {"id": "k7", "title": "Ergebnisse: Sizas Häuser in der Malagueira", "goal": "Sechs Häuser, Erd- und Obergeschoss, mit Messwerten und Vergleichsbildern.", "result": "", "commands": [], "cmdLabel": "Neu", "cover": "img/kremlas_fig_sz_ab_eg.webp", "units": [{"slide": 1, "title": "Messwerte", "short": "Messwerte", "subtitle": "", "notes": "", "orient": [], "orientLabel": "", "labels": [], "images": [], "captions": [], "hints": [], "downloads": [], "actions": [], "prompts": [], "promptsFirst": false, "steps": [], "boxes": [], "kontrolle": "", "fehler": [], "bloecke": [{"t": "p", "md": "Wie bei Palladio: vier Suchreihen je Geschoss, abgestimmte Voreinstellungen. Stand 24.11.2026, die Geschosse noch einzeln erzeugt; zum Haus aus zwei Geschossen siehe unten."}, {"t": "table", "kopf": ["Vorbild", "Rekonstruktion: beste", "Mittel", "Reihen", "Variante: beste", "Mittel", "Reihen"], "zeilen": [["Typ Ab (Hof v
